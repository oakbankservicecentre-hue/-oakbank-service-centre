 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Oakbank Service Centre</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:2px 0}.eyebrow{font-size:11px;letter-spacing:.14em;opacity:.7;font-weight:700}
main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}
.hidden{display:none!important}.muted,.meta{color:#6b7280}.message{min-height:20px;color:#b91c1c}
label{display:block;font-weight:600;margin:10px 0}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}textarea{min-height:80px}
button{border:0;border-radius:9px;padding:11px 14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#4b5563}.danger{background:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{text-align:left;background:#fff;color:#111827;border:1px solid #e5e7eb;padding:15px;min-height:100px}.tile span{font-size:25px;display:block}.tile b{display:block;margin-top:7px}.tile small{display:block;color:#6b7280;margin-top:4px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:0 0 auto}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-top:9px}.item strong{display:block;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #e5e7eb;border-radius:10px;padding:10px}.stat b{display:block;font-size:21px;margin-top:4px}
.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}.right{text-align:right!important}
.invoice{max-width:850px;margin:auto}.invoice-head{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:12px}.invoice-title{font-size:28px;font-weight:800}.invoice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:15px 0}.totals{max-width:330px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{border-top:2px solid #111827;font-size:18px;font-weight:800;padding-top:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.formgrid,.invoice-grid,.stats{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}.invoice-head{flex-direction:column}}
@media print{header,#login,#dashboard>.top,#dashboard>.grid,#dashboard>.connection,.no-print{display:none!important}main{padding:0;max-width:none}.panel{box-shadow:none;margin:0}.invoice{max-width:none}}
</style>
</head>
<body>
<header>
<div><div class="eyebrow">MANAGEMENT & BOOKKEEPING</div><h1>Oakbank Service Centre</h1></div>
<button id="logout" class="secondary hidden">Log out</button>
</header>
<main>
<section id="login" class="card">
<h2>Manager Login</h2>
<p class="muted">Sign in with your Supabase manager account.</p>
<form id="loginForm">
<label>Email<input id="email" type="email" required autocomplete="email"></label>
<label>Password<input id="password" type="password" required autocomplete="current-password"></label>
<button>Sign in</button><p id="loginMsg" class="message"></p>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="card top"><div class="eyebrow">DASHBOARD</div><h2>Oakbank Service Centre</h2><div id="stats" class="stats"></div></div>
<div id="panel" class="card panel hidden"></div>
<div class="grid">
<button class="tile" data-s="jobs"><span>🔧</span><b>Jobs</b><small>Repair jobs</small></button>
<button class="tile" data-s="customers"><span>👥</span><b>Customers</b><small>Find and manage customers</small></button>
<button class="tile" data-s="vehicles"><span>🚗</span><b>Vehicles</b><small>Customer vehicles</small></button>
<button class="tile" data-s="estimates"><span>📝</span><b>Estimates</b><small>Optional quote before work</small></button>
<button class="tile" data-s="invoices"><span>🧾</span><b>Invoices</b><small>Direct invoice or estimate invoice</small></button>
<button class="tile" data-s="payments"><span>💰</span><b>Payments</b><small>Record and edit payments</small></button>
<button class="tile" data-s="parts"><span>📦</span><b>Parts</b><small>Job parts and tax</small></button>
<button class="tile" data-s="expenses"><span>💳</span><b>Shop Expenses</b><small>Edit expenses and tax</small></button>
<button class="tile" data-s="reports"><span>📊</span><b>Bookkeeping</b><small>GST/PST and date-range reports</small></button>
<button class="tile" data-s="technicians"><span>👨‍🔧</span><b>Technicians</b><small>Rates, hours and labour profit</small></button>
</div>
<div class="card connection"><b>Connection</b><p id="connection" class="muted">Checking Supabase…</p></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gwzfrsixcdsyczbpmfqq.supabase.co";
const SUPABASE_KEY="sb_publishable_rC6FAks-NitzyqHgdh8z_w_8KfdZVqb";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), panel=$("panel"),login=$("login"),dashboard=$("dashboard"),logout=$("logout");
const GST=.05,PST=.07;
const money=v=>"$"+Number(v||0).toFixed(2);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const tax=(n,g,p)=>({gst:g?Number(n||0)*GST:0,pst:p?Number(n||0)*PST:0});
function show(){panel.classList.remove("hidden");setTimeout(()=>panel.scrollIntoView({behavior:"smooth",block:"start"}),30)}
function msg(id,text,error=false){const x=$(id);if(x){x.textContent=text;x.style.color=error?"#b91c1c":"#166534"}}
function optionsHtml(rows,selected=""){return rows.map(x=>`<option value="${x.id}" ${selected===x.id?"selected":""}>${esc(x.name)}${x.phone?" — "+esc(x.phone):""}</option>`).join("")}
async function customersForSelect(){const r=await db.from("customers").select("id,name,phone").order("name");return r.data||[]}
async function vehiclesForCustomer(cid){if(!cid)return[];const r=await db.from("vehicles").select("id,year,make,model,plate,vin").eq("customer_id",cid).order("created_at");return r.data||[]}
function header(title,sub,buttons=""){panel.innerHTML=`<h2>${title}</h2><p class="muted">${sub}</p><div class="actions">${buttons}</div>`;show()}

let authInitialized=false;
let currentSession=null;

function dashboardHome(){
  login.classList.add("hidden");
  dashboard.classList.remove("hidden");
  logout.classList.remove("hidden");
  $("connection").textContent="Connected to Supabase ✓";
  setTimeout(()=>stats(),0);
}
function loginHome(){
  dashboard.classList.add("hidden");
  login.classList.remove("hidden");
  logout.classList.add("hidden");
}
function applySession(session){
  currentSession=session||null;
  if(currentSession) dashboardHome();
  else loginHome();
}

// Single, stable auth initialization. We only treat an explicit SIGNED_OUT
// event as a logout; a transient startup/session event cannot bounce the user
// back to the login screen.
db.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_OUT"){
    applySession(null);
    return;
  }
  if(session){
    currentSession=session;
    dashboardHome();
  }
});

(async()=>{
  const {data,error}=await db.auth.getSession();
  authInitialized=true;
  if(error){
    console.error("Supabase session check failed",error);
    applySession(null);
    return;
  }
  applySession(data?.session||null);
})();


/* CUSTOMERS */
async function customers(){
 header("👥 Customers","Select an existing customer whenever possible to prevent duplicates.","<button id='newc'>New Customer</button><button class='secondary' id='listc'>View Customers</button>");
 $("newc").onclick=()=>customerForm();$("listc").onclick=viewCustomers;
}
function customerForm(c={}){
 panel.innerHTML=`<h2>${c.id?"Edit":"New"} Customer</h2><form id="cf">
 <label>Name<input id="cn" required value="${esc(c.name)}"></label>
 <div class="formgrid"><label>Phone<input id="cp" value="${esc(c.phone)}"></label><label>Email<input id="ce" type="email" value="${esc(c.email)}"></label></div>
 <label>Address<input id="ca" value="${esc(c.address)}"></label><label>Notes<textarea id="cno">${esc(c.notes)}</textarea></label>
 <div class="actions"><button>Save Customer</button><button type="button" class="secondary" id="cancel">Cancel</button></div><p id="cm" class="message"></p></form>`;show();
 $("cancel").onclick=customers;$("cf").onsubmit=async e=>{e.preventDefault();const d={name:$("cn").value.trim(),phone:$("cp").value.trim()||null,email:$("ce").value.trim()||null,address:$("ca").value.trim()||null,notes:$("cno").value.trim()||null};const r=c.id?await db.from("customers").update(d).eq("id",c.id):await db.from("customers").insert(d);if(r.error)msg("cm",r.error.message,true);else{msg("cm","Saved ✓");setTimeout(viewCustomers,350)}}
}
async function viewCustomers(){
 panel.innerHTML=`<h2>Customers</h2><input id="csearch" placeholder="Search name, phone or email"><div id="cl">Loading…</div>`;show();$("csearch").oninput=()=>loadCustomers($("csearch").value);loadCustomers("");
}
async function loadCustomers(q){
 let r=db.from("customers").select("*").order("created_at",{ascending:false});if(q.trim())r=r.or(`name.ilike.%${q.trim()}%,phone.ilike.%${q.trim()}%,email.ilike.%${q.trim()}%`);
 const x=await r;if(x.error){$("cl").textContent=x.error.message;return}
 $("cl").innerHTML=(x.data||[]).map(c=>`<div class="item"><strong>${esc(c.name)}</strong><div class="meta">${esc(c.phone||"No phone")} ${c.email?"• "+esc(c.email):""}</div><div class="actions"><button onclick='customerEdit(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button></div></div>`).join("")||"<p class='muted'>No customers found.</p>";
}
window.customerEdit=c=>customerForm(c);

/* VEHICLES */
async function vehicles(){header("🚗 Vehicles","Vehicles are linked to customers.","<button id='newv'>Add Vehicle</button><button class='secondary' id='listv'>View Vehicles</button>");$("newv").onclick=()=>vehicleForm();$("listv").onclick=viewVehicles}
async function vehicleForm(v={}){
 const cs=await customersForSelect();
 panel.innerHTML=`<h2>${v.id?"Edit":"Add"} Vehicle</h2><form id="vf">
 <label>Customer<select id="vc" required><option value="">Select customer</option>${optionsHtml(cs,v.customer_id)}</select></label>
 <div class="formgrid"><label>Year<input id="vy" type="number" value="${esc(v.year)}"></label><label>Make<input id="vmake" value="${esc(v.make)}"></label>
 <label>Model<input id="vmodel" value="${esc(v.model)}"></label><label>Trim<input id="vtrim" value="${esc(v.trim)}"></label>
 <label>VIN<input id="vvin" value="${esc(v.vin)}"></label><label>Plate<input id="vplate" value="${esc(v.plate)}"></label>
 <label>Mileage<input id="vmileage" type="number" value="${esc(v.mileage)}"></label></div>
 <label>Notes<textarea id="vnotes">${esc(v.notes)}</textarea></label><div class="actions"><button>Save Vehicle</button><button type="button" class="secondary" id="vcancel">Cancel</button></div><p id="vm" class="message"></p></form>`;show();
 $("vcancel").onclick=vehicles;$("vf").onsubmit=async e=>{e.preventDefault();const d={customer_id:$("vc").value,year:+$("vy").value||null,make:$("vmake").value.trim()||null,model:$("vmodel").value.trim()||null,trim:$("vtrim").value.trim()||null,vin:$("vvin").value.trim()||null,plate:$("vplate").value.trim()||null,mileage:+$("vmileage").value||null,notes:$("vnotes").value.trim()||null};const r=v.id?await db.from("vehicles").update(d).eq("id",v.id):await db.from("vehicles").insert(d);if(r.error)msg("vm",r.error.message,true);else{msg("vm","Saved ✓");setTimeout(viewVehicles,350)}}
}
async function viewVehicles(){panel.innerHTML=`<h2>Vehicles</h2><input id="vsearch" placeholder="Search make, model, plate or VIN"><div id="vl">Loading…</div>`;show();$("vsearch").oninput=()=>loadVehicles($("vsearch").value);loadVehicles("")}
async function loadVehicles(q){const r=await db.from("vehicles").select("*,customers(name)").order("created_at",{ascending:false});if(r.error){$("vl").textContent=r.error.message;return}const a=(r.data||[]).filter(v=>!q||[v.year,v.make,v.model,v.plate,v.vin,v.customers?.name].join(" ").toLowerCase().includes(q.toLowerCase()));$("vl").innerHTML=a.map(v=>`<div class="item"><strong>${esc([v.year,v.make,v.model,v.trim].filter(Boolean).join(" ")||"Vehicle")}</strong><div class="meta">${esc(v.customers?.name||"")} • Plate ${esc(v.plate||"")} • VIN ${esc(v.vin||"")}</div><div class="actions"><button onclick='vehicleEdit(${JSON.stringify(v).replace(/'/g,"&#39;")})'>Edit</button></div></div>`).join("")||"<p class='muted'>No vehicles found.</p>"}
window.vehicleEdit=v=>vehicleForm(v);

/* JOBS */
async function jobList(){const r=await db.from("repair_jobs").select("*,customers(name,phone),vehicles(year,make,model,plate)").order("created_at",{ascending:false});return r.data||[]}
async function jobs(){header("🔧 Jobs","Create and manage repair jobs. Choose an existing customer and vehicle.","<button id='newj'>New Job</button><button class='secondary' id='listj'>View Jobs</button>");$("newj").onclick=()=>jobForm();$("listj").onclick=viewJobs}
async function jobForm(j={}){
 const cs=await customersForSelect();
 panel.innerHTML=`<h2>${j.id?"Edit":"New"} Repair Job</h2><form id="jf">
 <label>Customer<select id="jc" required><option value="">Select customer</option>${optionsHtml(cs,j.customer_id)}</select></label>
 <label>Vehicle<select id="jv"><option value="">Select customer first</option></select></label>
 <label>Description<textarea id="jd" required>${esc(j.description)}</textarea>
 <div class="formgrid"><label>Estimate ($)<input id="je" type="number" step=".01" value="${j.estimate_amount||0}"></label><label>Final Amount ($)<input id="jfinal" type="number" step=".01" value="${j.final_amount||0}"></label>
 <label>Parts Cost ($)<input id="jpc" type="number" step=".01" value="${j.parts_cost||0}"></label><label>Labour ($)<input id="jlab" type="number" step=".01" value="${j.labour_amount||0}"></label></div>
 <div class="formgrid"><label>GST 5%<select id="jgst"><option value="false">No</option><option value="true" ${j.gst_enabled?"selected":""}>Yes</option></select></label><label>PST 7%<select id="jpst"><option value="false">No</option><option value="true" ${j.pst_enabled?"selected":""}>Yes</option></select></label></div>
 <div class="formgrid"><label>Status<select id="js"><option>Open</option><option>In Progress</option><option>Waiting for Parts</option><option>Ready</option><option>Completed</option><option>Picked Up</option><option>Cancelled</option></select></label><label>Expected Completion<input id="jec" type="date" value="${esc(j.expected_completion)}"></label></div>
 <label>Technician<input id="jt" value="${esc(j.technician)}"></label><label>Notes<textarea id="jn">${esc(j.notes)}</textarea></label>
 <div class="actions"><button>Save Job</button><button type="button" class="secondary" id="jcancel">Cancel</button></div><p id="jm" class="message"></p></form>`;show();
 if(j.id)$("js").value=j.status||"Open";
 async function loadV(){const a=await vehiclesForCustomer($("jc").value);$("jv").innerHTML='<option value="">Select vehicle</option>'+a.map(v=>`<option value="${v.id}">${esc([v.year,v.make,v.model].filter(Boolean).join(" "))} ${esc(v.plate||"")}</option>`).join("");if(j.id)$("jv").value=j.vehicle_id||""}
 $("jc").onchange=loadV;if(j.customer_id)loadV();$("jcancel").onclick=jobs;
 $("jf").onsubmit=async e=>{e.preventDefault();const base=+$("jfinal").value||+$("je").value||0,g=$("jgst").value==="true",p=$("jpst").value==="true",z=tax(base,g,p);const d={customer_id:$("jc").value,vehicle_id:$("jv").value||null,description:$("jd").value.trim(),status:$("js").value,estimate_amount:+$("je").value||0,final_amount:+$("jfinal").value||0,parts_cost:+$("jpc").value||0,labour_amount:+$("jlab").value||0,gst_enabled:g,pst_enabled:p,gst_amount:z.gst,pst_amount:z.pst,expected_completion:$("jec").value||null,technician:$("jt").value.trim()||null,notes:$("jn").value.trim()||null};const r=j.id?await db.from("repair_jobs").update(d).eq("id",j.id):await db.from("repair_jobs").insert(d).select("job_number").single();if(r.error)msg("jm",r.error.message,true);else{msg("jm","Job saved "+(r.data?.job_number?"— Job #"+r.data.job_number:"")+" ✓");stats();setTimeout(viewJobs,450)}}
}
async function viewJobs(){const a=await jobList();panel.innerHTML=`<h2>Jobs</h2><input id="jq" placeholder="Search job, customer, vehicle or status"><div id="jl">Loading…</div>`;show();function draw(q){const x=a.filter(j=>!q||[j.job_number,j.status,j.description,j.customers?.name,j.vehicles?.make,j.vehicles?.model,j.vehicles?.plate].join(" ").toLowerCase().includes(q.toLowerCase()));$("jl").innerHTML=x.map(j=>`<div class="item"><strong>Job #${j.job_number} — ${esc(j.customers?.name||"")}</strong><div class="meta">${esc([j.vehicles?.year,j.vehicles?.make,j.vehicles?.model].filter(Boolean).join(" "))} • ${esc(j.vehicles?.plate||"")} • ${esc(j.status)}</div><div>${esc(j.description)}</div><div class="actions"><button onclick='jobEdit(${JSON.stringify(j).replace(/'/g,"&#39;")})'>Edit</button><button onclick="jobInvoice('${j.id}')">Invoice</button></div></div>`).join("")||"<p class='muted'>No jobs found.</p>"}$("jq").oninput=()=>draw($("jq").value);draw("")}
window.jobEdit=j=>jobForm(j);window.jobInvoice=id=>jobInvoice(id);

/* PARTS */
async function parts(){header("📦 Parts","Parts are linked to repair jobs. Existing parts can be edited.","<button id='newp'>New Part</button><button class='secondary' id='listp'>View Parts</button>");$("newp").onclick=()=>partForm();$("listp").onclick=viewParts}
async function partForm(p={}){
 const jobs=await jobList();
 panel.innerHTML=`<h2>${p.id?"Edit":"New"} Part</h2><form id="pf">
 <label>Job<select id="pj" required><option value="">Select job</option>${jobs.map(j=>`<option value="${j.id}" ${p.job_id===j.id?"selected":""}>#${j.job_number} — ${esc(j.customers?.name||"")} — ${esc(j.description)}</option>`).join("")}</select></label>
 <div class="formgrid"><label>Part Name<input id="pn" required value="${esc(p.part_name)}"></label><label>Part Number<input id="ppn" value="${esc(p.part_number)}"></label>
 <label>Supplier<input id="ps" value="${esc(p.supplier)}"></label><label>Quantity<input id="pq" type="number" step=".01" value="${p.quantity||1}"></label>
 <label>Cost ($)<input id="pc" type="number" step=".01" value="${p.cost||0}"></label><label>Selling Price ($)<input id="psell" type="number" step=".01" value="${p.sell_price||0}"></label></div>
 <div class="formgrid"><label>GST 5%<select id="pg"><option value="false">No</option><option value="true" ${p.gst_enabled?"selected":""}>Yes</option></select></label><label>PST 7%<select id="pp"><option value="false">No</option><option value="true" ${p.pst_enabled?"selected":""}>Yes</option></select></label></div>
 <div class="actions"><button>Save Part</button><button type="button" class="secondary" id="pcancel">Cancel</button></div><p id="pm" class="message"></p></form>`;show();$("pcancel").onclick=parts;
 $("pf").onsubmit=async e=>{e.preventDefault();const base=(+$("psell").value||0)*(+$("pq").value||1),g=$("pg").value==="true",pp=$("pp").value==="true",z=tax(base,g,pp);const d={job_id:$("pj").value,part_name:$("pn").value.trim(),part_number:$("ppn").value.trim()||null,supplier:$("ps").value.trim()||null,quantity:+$("pq").value||1,cost:+$("pc").value||0,sell_price:+$("psell").value||0,gst_enabled:g,pst_enabled:pp,gst_amount:z.gst,pst_amount:z.pst};const r=p.id?await db.from("job_parts").update(d).eq("id",p.id):await db.from("job_parts").insert(d);if(r.error)msg("pm",r.error.message,true);else{msg("pm","Saved ✓");setTimeout(viewParts,350)}}
}
async function viewParts(){const r=await db.from("job_parts").select("*,repair_jobs(job_number,customers(name))").order("created_at",{ascending:false});panel.innerHTML=`<h2>Parts</h2>`+(r.data||[]).map(p=>`<div class="item"><strong>${esc(p.part_name)}</strong><div class="meta">Job #${p.repair_jobs?.job_number||""} • ${esc(p.repair_jobs?.customers?.name||"")}</div><div>Qty ${p.quantity} • Cost ${money(p.cost)} • Sell ${money(p.sell_price)} • GST ${money(p.gst_amount)} • PST ${money(p.pst_amount)}</div><div class="actions"><button onclick='partEdit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button></div></div>`).join("")||"<p class='muted'>No parts yet.</p>";show()}
window.partEdit=p=>partForm(p);

/* PAYMENTS */
async function payments(){header("💰 Payments","Record payments. GST/PST are optional, including cash payments.","<button id='newpay'>New Payment</button><button class='secondary' id='listpay'>View Payments</button>");$("newpay").onclick=()=>paymentForm();$("listpay").onclick=viewPayments}
async function paymentForm(p={}){
 const jobs=await jobList(), invoices=await db.from("invoices").select("id,invoice_number,total").order("created_at",{ascending:false});
 panel.innerHTML=`<h2>${p.id?"Edit":"New"} Payment</h2><form id="payf">
 <label>Job<select id="payj"><option value="">No job</option>${jobs.map(j=>`<option value="${j.id}" ${p.job_id===j.id?"selected":""}>#${j.job_number} — ${esc(j.customers?.name||"")}</option>`).join("")}</select></label>
 <label>Invoice<select id="payi"><option value="">No invoice</option>${(invoices.data||[]).map(i=>`<option value="${i.id}" ${p.invoice_id===i.id?"selected":""}>Invoice #${i.invoice_number} — ${money(i.total)}</option>`).join("")}</select></label>

 panel.innerHTML=`<h2>Technician Hours</h2><div class="item"><b>Total hours:</b> ${a.reduce((s,x)=>s+(+x.hours||0),0).toFixed(2)} • <b>Labour cost:</b> ${money(cost)} • <b>Labour billed:</b> ${money(bill)} • <b>Margin:</b> ${money(bill-cost)}</div>${a.map(x=>`<div class="item"><strong>${esc(x.technicians?.name||"")} — ${esc(x.work_date)}</strong><div>Job #${x.repair_jobs?.job_number||""} • ${(+x.hours||0).toFixed(2)} hr • Cost ${money((+x.hours||0)*(+x.cost_rate||0))} • Billed ${money((+x.hours||0)*(+x.billed_rate||0))}</div><div class="meta">${esc(x.notes||"")}</div></div>`).join("")||"<p class='muted'>No technician hours recorded.</p>"}<div class="actions"><button onclick="technicianHoursForm()">Record Hours</button><button class="secondary" onclick="technicians()">Back</button></div>`;show();
}

/* BOOKKEEPING / WEEKEND REPORTS */
async function reports(){header("📊 Bookkeeping","Select a date range. The report calculates payments, expenses and separate GST/PST automatically.","<button id='gen'>Generate Report</button><button class='secondary' id='csv'>Export CSV</button>");panel.innerHTML+=`<div class="formgrid"><label>From<input id="rf" type="date" value="${new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10)}"></label><label>To<input id="rt" type="date" value="${today()}"></label></div><div id="reportout"></div>`;$("gen").onclick=generateReport;$("csv").onclick=exportCSV;show()}
let lastReport=null;
async function generateReport(){
 const f=$("rf").value,t=$("rt").value;
 const [p,e,j]=await Promise.all([db.from("payments").select("*").gte("payment_date",f).lte("payment_date",t).order("payment_date"),db.from("shop_expenses").select("*").gte("expense_date",f).lte("expense_date",t).order("expense_date"),db.from("repair_jobs").select("id,status").gte("date_received",f).lte("date_received",t)]);
 if(p.error||e.error||j.error){$("reportout").innerHTML="<p class='message'>"+esc((p.error||e.error||j.error).message)+"</p>";return}
 const pg=(p.data||[]).reduce((s,x)=>s+(+x.gst_amount||0),0),pp=(p.data||[]).reduce((s,x)=>s+(+x.pst_amount||0),0),eg=(e.data||[]).reduce((s,x)=>s+(+x.gst_amount||0),0),ep=(e.data||[]).reduce((s,x)=>s+(+x.pst_amount||0),0),rev=(p.data||[]).reduce((s,x)=>s+(+x.amount||0),0),ex=(e.data||[]).reduce((s,x)=>s+(+x.amount||0),0);
 lastReport={from:f,to:t,payments:p.data||[],expenses:e.data||[],jobs:(j.data||[]),paymentGst:pg,paymentPst:pp,expenseGst:eg,expensePst:ep,revenue:rev,expensesTotal:ex};
 $("reportout").innerHTML=`<div class="item"><strong>Bookkeeping Report: ${f} to ${t}</strong><div>Payments received: <b>${money(rev)}</b></div><div>Shop expenses: <b>${money(ex)}</b></div><hr><div><b>GST on payments:</b> ${money(pg)}</div><div><b>PST on payments:</b> ${money(pp)}</div><div><b>GST on expenses:</b> ${money(eg)}</div><div><b>PST on expenses:</b> ${money(ep)}</div><div class="grand">Net GST: ${money(pg-eg)} &nbsp; | &nbsp; Net PST: ${money(pp-ep)}</div><div>Jobs received in range: ${(j.data||[]).length}</div></div>
 <div class="item"><strong>Payment Details</strong>${(p.data||[]).map(x=>`<div>${esc(x.payment_date)} — ${money(x.amount)} — ${esc(x.payment_method)} — GST ${money(x.gst_amount)} — PST ${money(x.pst_amount)}</div>`).join("")||"<div class='muted'>None</div>"}</div>
 <div class="item"><strong>Expense Details</strong>${(e.data||[]).map(x=>`<div>${esc(x.expense_date)} — ${money(x.amount)} — ${esc(x.category||"")} — GST ${money(x.gst_amount)} — PST ${money(x.pst_amount)}</div>`).join("")||"<div class='muted'>None</div>"}</div>`;
}
function exportCSV(){
 if(!lastReport){alert("Generate the report first.");return}
 const rows=[["Type","Date","Description","Amount","GST","PST","Method/Category"],...lastReport.payments.map(x=>["Payment",x.payment_date,x.notes||"",x.amount,x.gst_amount,x.pst_amount,x.payment_method]),...lastReport.expenses.map(x=>["Expense",x.expense_date,x.description||"",x.amount,x.gst_amount,x.pst_amount,x.category||""])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`oakbank-bookkeeping-${lastReport.from}-to-${lastReport.to}.csv`;a.click();URL.revokeObjectURL(a.href)
}

/* ROUTING */
const routes={jobs,customers,vehicles,estimates,invoices,payments,parts,expenses,reports,technicians};
document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>routes[b.dataset.s]());
</script>
