 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oakbank Service Centre</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:2px 0}.eyebrow{font-size:11px;letter-spacing:.14em;opacity:.7;font-weight:700}
main{max-width:1100px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{text-align:left;background:white;color:#111827;border:1px solid #e5e7eb;padding:18px;border-radius:12px}
.tile span{font-size:25px;display:block;margin-bottom:8px}.tile b{display:block}.tile small{display:block;color:#6b7280;margin-top:4px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:600;margin:10px 0}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}textarea{min-height:90px}
button{border:0;border-radius:9px;padding:12px 15px;font-weight:700;background:#111827;color:white}button.secondary{background:#4b5563}button.danger{background:#b91c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.muted{color:#6b7280}.msg{min-height:20px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:14px;border:1px solid #e5e7eb;border-radius:10px}.kpi b{font-size:20px;display:block;margin-top:5px}
@media(max-width:700px){.grid,.formgrid,.kpis{grid-template-columns:1fr}.hide-mobile{display:none}table{font-size:12px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">MANAGEMENT</div><h1>Oakbank Service Centre</h1></div><button id="logout" class="secondary hidden">Log out</button></header>
<main>
<section id="login" class="card">
<h2>Manager Login</h2><p class="muted">Sign in with your Supabase manager account.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button><p id="loginMsg" class="msg"></p></form>
</section>
<section id="app" class="hidden">
<div class="card"><div class="eyebrow">DASHBOARD</div><h2>Oakbank Service Centre</h2><div class="kpis">
<div class="kpi">Jobs<b id="kJobs">0</b></div><div class="kpi">Customers<b id="kCustomers">0</b></div><div class="kpi">Payments<b id="kPayments">$0.00</b></div><div class="kpi">Expenses<b id="kExpenses">$0.00</b></div></div></div>
<div id="panel" class="card hidden"></div>
<div class="grid">
<button class="tile" data-view="jobs"><span>🔧</span><b>Jobs</b><small>Create, edit, track jobs</small></button>
<button class="tile" data-view="customers"><span>👥</span><b>Customers</b><small>Search and manage customers</small></button>
<button class="tile" data-view="vehicles"><span>🚗</span><b>Vehicles</b><small>Customer vehicles</small></button>
<button class="tile" data-view="estimates"><span>📝</span><b>Estimates</b><small>Separate estimate workflow</small></button>
<button class="tile" data-view="invoices"><span>🧾</span><b>Invoices</b><small>Direct invoices and estimate conversion</small></button>
<button class="tile" data-view="payments"><span>💰</span><b>Payments</b><small>Record and edit payments</small></button>
<button class="tile" data-view="parts"><span>📦</span><b>Parts</b><small>Costs, selling prices and tax</small></button>
<button class="tile" data-view="expenses"><span>💵</span><b>Shop Expenses</b><small>Edit expenses and tax</small></button>
<button class="tile" data-view="technicians"><span>👨‍🔧</span><b>Technicians</b><small>Rates and hours</small></button>
<button class="tile" data-view="supplies"><span>🧰</span><b>Shop Supplies</b><small>Job/estimate/invoice supplies</small></button>
<button class="tile" data-view="reports"><span>📊</span><b>Weekend Reports</b><small>Payments, expenses and taxes</small></button>
<button class="tile" data-view="bookkeeping"><span>📚</span><b>Bookkeeping</b><small>Date-range accounting</small></button>
<button class="tile" data-view="photos"><span>📷</span><b>Job Photos</b><small>Before, during, after, other</small></button>
<button class="tile" data-view="fixed"><span>🏢</span><b>Fixed Expenses</b><small>Recurring expenses</small></button>
<button class="tile" data-view="suppliers"><span>📄</span><b>Supplier Invoices</b><small>Supplier records</small></button>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://gwzfrsixcdsyczbpmfqq.supabase.co",KEY="sb_publishable_rC6FAks-NitzyqHgdh8z_w_8KfdZVqb";
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const GST=.05,PST=.07,$=id=>document.getElementById(id);
function money(n){return "$"+Number(n||0).toFixed(2)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function taxes(base,g=true,p=true){return {gst:g?base*GST:0,pst:p?base*PST:0}}
function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");refreshKpis()}
function showLogin(){ $("app").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden")}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="Signing in…";let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)$("loginMsg").textContent=r.error.message;else $("loginMsg").textContent=""}
$("logout").onclick=async()=>{await db.auth.signOut();showLogin()}
let authReady=false;
db.auth.onAuthStateChange((event,session)=>{if(session) setTimeout(showApp,0); else if(event==="SIGNED_OUT"||authReady) setTimeout(showLogin,0)});
(async()=>{let r=await db.auth.getSession();authReady=true;if(r.data.session)showApp();else showLogin()})();
async function count(t){let r=await db.from(t).select("*",{count:"exact",head:true});return r.count||0}
async function refreshKpis(){try{$("kJobs").textContent=await count("repair_jobs");$("kCustomers").textContent=await count("customers");let p=await db.from("payments").select("amount");$("kPayments").textContent=money((p.data||[]).reduce((a,x)=>a+Number(x.amount||0),0));let e=await db.from("shop_expenses").select("amount");$("kExpenses").textContent=money((e.data||[]).reduce((a,x)=>a+Number(x.amount||0),0))}catch(e){}}
function panel(title,body){$("panel").innerHTML="<h2>"+title+"</h2>"+body;$("panel").classList.remove("hidden");$("panel").scrollIntoView({behavior:"smooth",block:"start"})}
async function customers(){let r=await db.from("customers").select("*").order("created_at",{ascending:false});panel("👥 Customers",`<div class="actions"><button onclick="newCustomer()">New Customer</button><input id="custSearch" placeholder="Search customers..." oninput="filterTable('custTable',this.value)"></div><div id="custTable">${tableCustomers(r.data||[])}</div>`)}
function tableCustomers(a){return `<table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Action</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td><button onclick='editCustomer(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table>`}
function newCustomer(x={}){panel("👥 "+(x.id?"Edit":"New")+" Customer",`<form id="cf"><div class="formgrid"><label>Name<input id="cn" required value="${esc(x.name)}"></label><label>Phone<input id="cp" value="${esc(x.phone)}"></label><label>Email<input id="ce" value="${esc(x.email)}"></label><label>Address<input id="ca" value="${esc(x.address)}"></label></div><label>Notes<textarea id="co">${esc(x.notes)}</textarea></label><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="customers()">Cancel</button></div><p id="fm" class="msg"></p></form>`);$("cf").onsubmit=async e=>{e.preventDefault();let o={name:$("cn").value.trim(),phone:$("cp").value.trim()||null,email:$("ce").value.trim()||null,address:$("ca").value.trim()||null,notes:$("co").value.trim()||null};let r=x.id?await db.from("customers").update(o).eq("id",x.id):await db.from("customers").insert(o);$("fm").textContent=r.error?r.error.message:"Saved ✓";if(!r.error)setTimeout(customers,500)}}
function editCustomer(x){newCustomer(x)}
async function vehicles(){let r=await db.from("vehicles").select("*,customers(name)").order("created_at",{ascending:false});panel("🚗 Vehicles",`<button onclick="newVehicle()">Add Vehicle</button><div>${(r.data||[]).map(x=>`<div class="card"><b>${esc(x.year)} ${esc(x.make)} ${esc(x.model)}</b><div>${esc(x.customers?.name||"")} • ${esc(x.plate)}</div><button onclick='editVehicle(${JSON.stringify(x)})'>Edit</button></div>`).join("")}</div>`)}
async function newVehicle(x={}){let c=await db.from("customers").select("id,name").order("name");panel("🚗 "+(x.id?"Edit":"Add")+" Vehicle",`<form id="vf"><label>Customer<select id="vc" required>${(c.data||[]).map(y=>`<option value="${y.id}" ${y.id===x.customer_id?"selected":""}>${esc(y.name)}</option>`).join("")}</select></label><div class="formgrid"><label>Year<input id="vy" type="number" value="${x.year||""}"></label><label>Make<input id="vm" value="${esc(x.make)}"></label><label>Model<input id="vmo" value="${esc(x.model)}"></label><label>Trim<input id="vt" value="${esc(x.trim)}"></label><label>VIN<input id="vv" value="${esc(x.vin)}"></label><label>Plate<input id="vp" value="${esc(x.plate)}"></label><label>Mileage<input id="vmi" type="number" value="${x.mileage||""}"></label></div><label>Notes<textarea id="vn">${esc(x.notes)}</textarea></label><button>Save</button></form>`);$("vf").onsubmit=async e=>{e.preventDefault();let o={customer_id:$("vc").value,year:Number($("vy").value)||null,make:$("vm").value||null,model:$("vmo").value||null,trim:$("vt").value||null,vin:$("vv").value||null,plate:$("vp").value||null,mileage:Number($("vmi").value)||null,notes:$("vn").value||null};let r=x.id?await db.from("vehicles").update(o).eq("id",x.id):await db.from("vehicles").insert(o);if(!r.error)vehicles();else alert(r.error.message)}}
function editVehicle(x){newVehicle(x)}
async function jobs(){let r=await db.from("repair_jobs").select("*,customers(name),vehicles(year,make,model,plate)").order("created_at",{ascending:false});panel("🔧 Jobs",`<div class="actions"><button onclick="newJob()">New Job</button><input id="jobSearch" placeholder="Search..." oninput="filterTable('jobTable',this.value)"></div><div id="jobTable"><table><tr><th>Job</th><th>Customer</th><th>Vehicle</th><th>Status</th><th>Total</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>#${x.job_number}</td><td>${esc(x.customers?.name)}</td><td>${esc([x.vehicles?.year,x.vehicles?.make,x.vehicles?.model].filter(Boolean).join(" "))}</td><td>${esc(x.status)}</td><td>${money(x.final_amount||x.estimate_amount)}</td><td><button onclick='editJob(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table></div>`)}
async function jobCustomerOptions(selected){let r=await db.from("customers").select("id,name,phone").order("name");return (r.data||[]).map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.name)}${x.phone?" — "+esc(x.phone):""}</option>`).join("")}
async function newJob(x={}){let opts=await jobCustomerOptions(x.customer_id);panel("🔧 "+(x.id?"Edit":"New")+" Job",`<form id="jf"><label>Customer<select id="jc" required>${opts}</select></label><label>Vehicle<select id="jv"><option value="">Select after customer</option></select></label><label>Description<textarea id="jd" required>${esc(x.description)}</textarea></label><div class="formgrid"><label>Status<select id="js"><option>Open</option><option>In Progress</option><option>Waiting for Parts</option><option>Ready</option><option>Completed</option><option>Picked Up</option><option>Cancelled</option></select></label><label>Expected Completion<input id="je" type="date" value="${x.expected_completion||""}"></label><label>Estimate<input id="ja" type="number" step=".01" value="${x.estimate_amount||0}"></label><label>Labour billed<input id="jl" type="number" step=".01" value="${x.labour_amount||0}"></label><label>Parts cost<input id="jp" type="number" step=".01" value="${x.parts_cost||0}"></label><label>Final amount<input id="jfina" type="number" step=".01" value="${x.final_amount||0}"></label><label>Technician<input id="jt" value="${esc(x.technician)}"></label></div><label><input id="jg" type="checkbox" ${x.gst_enabled?"checked":""}> GST 5%</label><label><input id="jps" type="checkbox" ${x.pst_enabled?"checked":""}> PST 7%</label><label>Notes<textarea id="jn">${esc(x.notes)}</textarea></label><div class="actions"><button>Save Job</button><button type="button" onclick="jobs()" class="secondary">Cancel</button></div><p id="jm" class="msg"></p></form>`);$("js").value=x.status||"Open";async function loadV(){let r=await db.from("vehicles").select("id,year,make,model,plate").eq("customer_id",$("jc").value).order("created_at");$("jv").innerHTML='<option value="">Select vehicle</option>'+(r.data||[]).map(v=>`<option value="${v.id}" ${v.id===x.vehicle_id?"selected":""}>${esc([v.year,v.make,v.model].filter(Boolean).join(" "))} ${esc(v.plate||"")}</option>`).join("")}$("jc").onchange=loadV;await loadV();$("jf").onsubmit=async e=>{e.preventDefault();let base=Number($("ja").value||0),t=taxes(base,$("jg").checked,$("jps").checked);let o={customer_id:$("jc").value,vehicle_id:$("jv").value||null,description:$("jd").value,status:$("js").value,expected_completion:$("je").value||null,estimate_amount:base,labour_amount:Number($("jl").value||0),parts_cost:Number($("jp").value||0),final_amount:Number($("jfina").value||0),technician:$("jt").value||null,notes:$("jn").value||null,gst_enabled:$("jg").checked,pst_enabled:$("jps").checked,gst_amount:t.gst,pst_amount:t.pst};let r=x.id?await db.from("repair_jobs").update(o).eq("id",x.id):await db.from("repair_jobs").insert(o);$("jm").textContent=r.error?r.error.message:"Saved ✓";if(!r.error)setTimeout(jobs,500)}}
function editJob(x){newJob(x)}
function generic(title,table,fields){panel(title,`<p class="muted">This module is connected to the existing Supabase table <b>${table}</b>.</p><div class="actions"><button onclick="location.reload()">Refresh</button></div><p>Use the database-backed workflow here after the core job/customer workflow is verified.</p>`)}
async function payments(){let r=await db.from("payments").select("*,repair_jobs(job_number)").order("payment_date",{ascending:false});panel("💰 Payments",`<button onclick="newPayment()">New Payment</button><table><tr><th>Job</th><th>Amount</th><th>Method</th><th>Date</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>#${x.repair_jobs?.job_number||""}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.payment_date)}</td><td><button onclick='editPayment(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table>`)}
async function newPayment(x={}){let j=await db.from("repair_jobs").select("id,job_number,customers(name)").order("created_at",{ascending:false});panel("💰 "+(x.id?"Edit":"New")+" Payment",`<form id="pf"><label>Job<select id="pj" required>${(j.data||[]).map(q=>`<option value="${q.id}" ${q.id===x.job_id?"selected":""}>#${q.job_number} — ${esc(q.customers?.name)}</option>`).join("")}</select></label><div class="formgrid"><label>Amount<input id="pa" type="number" step=".01" required value="${x.amount||""}"></label><label>Method<select id="pm">${["cash","debit","credit","etransfer","other"].map(m=>`<option ${m===x.payment_method?"selected":""}>${m}</option>`).join("")}</select></label><label>Date<input id="pd" type="date" value="${x.payment_date||new Date().toISOString().slice(0,10)}"></label></div><label><input id="pg" type="checkbox" ${x.gst_enabled?"checked":""}> GST 5%</label><label><input id="pp" type="checkbox" ${x.pst_enabled?"checked":""}> PST 7%</label><label>Notes<textarea id="pn">${esc(x.notes)}</textarea></label><button>Save</button></form>`);$("pf").onsubmit=async e=>{e.preventDefault();let b=Number($("pa").value),t=taxes(b,$("pg").checked,$("pp").checked),o={job_id:$("pj").value,amount:b,payment_method:$("pm").value,payment_date:$("pd").value,notes:$("pn").value||null,gst_enabled:$("pg").checked,pst_enabled:$("pp").checked,gst_amount:t.gst,pst_amount:t.pst};let r=x.id?await db.from("payments").update(o).eq("id",x.id):await db.from("payments").insert(o);if(!r.error)payments();else alert(r.error.message)}}
function editPayment(x){newPayment(x)}
async function parts(){let r=await db.from("job_parts").select("*,repair_jobs(job_number)").order("created_at",{ascending:false});panel("📦 Parts",`<button onclick="newPart()">Add Part</button><table><tr><th>Part</th><th>Job</th><th>Qty</th><th>Cost</th><th>Sell</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.part_name)}</td><td>#${x.repair_jobs?.job_number||""}</td><td>${x.quantity}</td><td>${money(x.actual_cost??x.cost)}</td><td>${money(x.sold_price??x.sell_price)}</td><td><button onclick='editPart(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table>`)}
async function newPart(x={}){let j=await db.from("repair_jobs").select("id,job_number").order("created_at",{ascending:false});panel("📦 "+(x.id?"Edit":"Add")+" Part",`<form id="partf"><label>Job<select id="pjb" required>${(j.data||[]).map(q=>`<option value="${q.id}" ${q.id===x.job_id?"selected":""}>#${q.job_number}</option>`).join("")}</select></label><div class="formgrid"><label>Part name<input id="pname" required value="${esc(x.part_name)}"></label><label>Part number<input id="pnum" value="${esc(x.part_number)}"></label><label>Supplier<input id="psup" value="${esc(x.supplier)}"></label><label>Quantity<input id="pqty" type="number" step=".01" value="${x.quantity||1}"></label><label>Actual cost<input id="pcost" type="number" step=".01" value="${x.actual_cost??x.cost??0}"></label><label>Sold price<input id="psold" type="number" step=".01" value="${x.sold_price??x.sell_price??0}"></label><label>Margin %<input id="pmargin" type="number" step=".01" value="${x.margin_percent||0}"></label></div><label><input id="pgst" type="checkbox" ${x.gst_enabled?"checked":""}> GST 5%</label><label><input id="ppst" type="checkbox" ${x.pst_enabled?"checked":""}> PST 7%</label><button>Save</button></form>`);$("partf").onsubmit=async e=>{e.preventDefault();let sold=Number($("psold").value||0),t=taxes(sold,$("pgst").checked,$("ppst").checked),o={job_id:$("pjb").value,part_name:$("pname").value,part_number:$("pnum").value||null,supplier:$("psup").value||null,quantity:Number($("pqty").value||1),cost:Number($("pcost").value||0),sell_price:sold,actual_cost:Number($("pcost").value||0),sold_price:sold,margin_percent:Number($("pmargin").value||0),gst_enabled:$("pgst").checked,pst_enabled:$("ppst").checked,gst_amount:t.gst,pst_amount:t.pst,sold_gst:t.gst,sold_pst:t.pst};let r=x.id?await db.from("job_parts").update(o).eq("id",x.id):await db.from("job_parts").insert(o);if(!r.error)parts();else alert(r.error.message)}}
function editPart(x){newPart(x)}
async function expenses(){let r=await db.from("shop_expenses").select("*").order("expense_date",{ascending:false});panel("💵 Shop Expenses",`<button onclick="newExpense()">New Expense</button><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>GST</th><th>PST</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${money(x.gst_amount)}</td><td>${money(x.pst_amount)}</td><td><button onclick='editExpense(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table>`)}
async function newExpense(x={}){panel("💵 "+(x.id?"Edit":"New")+" Expense",`<form id="ef"><div class="formgrid"><label>Date<input id="ed" type="date" value="${x.expense_date||new Date().toISOString().slice(0,10)}"></label><label>Category<input id="ec" value="${esc(x.category)}"></label><label>Amount<input id="ea" type="number" step=".01" value="${x.amount||0}"></label><label>Vendor<input id="ev" value="${esc(x.vendor)}"></label></div><label>Description<input id="edesc" value="${esc(x.description)}"></label><label><input id="eg" type="checkbox"> GST 5%</label><label><input id="ep" type="checkbox"> PST 7%</label><label>Notes<textarea id="en">${esc(x.notes)}</textarea></label><button>Save</button></form>`);$("ef").onsubmit=async e=>{e.preventDefault();let b=Number($("ea").value),t=taxes(b,$("eg").checked,$("ep").checked),o={expense_date:$("ed").value,category:$("ec").value,description:$("edesc").value,amount:b,vendor:$("ev").value||null,notes:$("en").value||null,gst_amount:t.gst,pst_amount:t.pst};let r=x.id?await db.from("shop_expenses").update(o).eq("id",x.id):await db.from("shop_expenses").insert(o);if(!r.error)expenses();else alert(r.error.message)}}
function editExpense(x){newExpense(x)}
async function technicians(){let r=await db.from("technicians").select("*").order("name");panel("👨‍🔧 Technicians",`<button onclick="newTech()">New Technician</button><table><tr><th>Name</th><th>Cost/hr</th><th>Bill/hr</th><th>Active</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.cost_per_hour)}</td><td>${money(x.default_bill_rate)}</td><td>${x.active?"Yes":"No"}</td><td><button onclick='editTech(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</table>`)}
async function newTech(x={}){panel("👨‍🔧 "+(x.id?"Edit":"New")+" Technician",`<form id="tf"><div class="formgrid"><label>Name<input id="tn" required value="${esc(x.name)}"></label><label>Cost/hour<input id="tc" type="number" step=".01" value="${x.cost_per_hour||0}"></label><label>Default bill/hour<input id="tb" type="number" step=".01" value="${x.default_bill_rate||0}"></label></div><label><input id="ta" type="checkbox" ${x.active!==false?"checked":""}> Active</label><button>Save</button></form>`);$("tf").onsubmit=async e=>{e.preventDefault();let o={name:$("tn").value,cost_per_hour:Number($("tc").value||0),default_bill_rate:Number($("tb").value||0),active:$("ta").checked},r=x.id?await db.from("technicians").update(o).eq("id",x.id):await db.from("technicians").insert(o);if(!r.error)technicians();else alert(r.error.message)}}
function editTech(x){newTech(x)}
async function genericList(title,table,columns){let r=await db.from(table).select("*").limit(100).order("created_at",{ascending:false});panel(title,`<p class="muted">Connected to <b>${table}</b>.</p><table><tr>${columns.map(c=>`<th>${c}</th>`).join("")}</tr>${(r.data||[]).map(x=>`<tr>${columns.map(c=>`<td>${esc(x[c.toLowerCase().replace(/ /g,"_")]??"")}</td>`).join("")}</tr>`).join("")}</table>`)}
async function estimates(){await genericList("📝 Estimates","estimates",["id","estimate_number","status","subtotal","gst_amount","pst_amount","total"])}
async function invoices(){await genericList("🧾 Invoices","invoices",["id","invoice_number","status","subtotal","gst_amount","pst_amount","total"])}
async function supplies(){await genericList("🧰 Shop Supplies","shop_supplies",["id","description","actual_cost","sold_price"])}
async function fixed(){await genericList("🏢 Fixed Expenses","fixed_expenses",["id","name","category","amount","frequency"])}
async function suppliers(){await genericList("📄 Supplier Invoices","supplier_invoices",["id","vendor","invoice_number","total"])}
async function photos(){await genericList("📷 Job Photos","job_photos",["id","job_id","photo_type","file_url"])}
async function reports(){await genericList("📊 Weekend Reports","weekend_reports",["id","report_date","revenue","parts_expense","labour_expense","other_expense","outstanding_amount","payment_gst","payment_pst","expense_gst","expense_pst","net_gst","net_pst"])}
async function bookkeeping(){panel("📚 Bookkeeping",`<form id="bk"><div class="formgrid"><label>From<input id="bf" type="date"></label><label>To<input id="bt" type="date"></label></div><button>Generate</button></form><div id="bkout"></div>`);$("bk").onsubmit=async e=>{e.preventDefault();let f=$("bf").value,t=$("bt").value,p=await db.from("payments").select("amount,gst_amount,pst_amount,payment_date").gte("payment_date",f).lte("payment_date",t),x=await db.from("shop_expenses").select("amount,gst_amount,pst_amount,expense_date").gte("expense_date",f).lte("expense_date",t),ps=p.data||[],es=x.data||[],rev=ps.reduce((a,z)=>a+Number(z.amount||0),0),ex=es.reduce((a,z)=>a+Number(z.amount||0),0),pg=ps.reduce((a,z)=>a+Number(z.gst_amount||0),0),pp=ps.reduce((a,z)=>a+Number(z.pst_amount||0),0),eg=es.reduce((a,z)=>a+Number(z.gst_amount||0),0),ep=es.reduce((a,z)=>a+Number(z.pst_amount||0),0);$("bkout").innerHTML=`<div class="kpis"><div class="kpi">Payments<b>${money(rev)}</b></div><div class="kpi">Expenses<b>${money(ex)}</b></div><div class="kpi">Net GST<b>${money(pg-eg)}</b></div><div class="kpi">Net PST<b>${money(pp-ep)}</b></div></div>`}}
function filterTable(id,q){let t=$(id);if(!t)return;[...t.querySelectorAll("tr")].slice(1).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?"":"none")}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>window[b.dataset.view]());
</script>
