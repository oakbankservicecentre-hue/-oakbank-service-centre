 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Oakbank Service Centre</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:2px 0}.eyebrow{font-size:11px;letter-spacing:.14em;opacity:.7;font-weight:700}
main{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h2,h3{margin-top:0}.muted{color:#6b7280}.message{min-height:20px;color:#b91c1c}
label{display:block;font-weight:600;margin:12px 0}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;font-family:inherit}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:700;background:#111827;color:#fff;cursor:pointer}
button:disabled{opacity:.6}.secondary{background:#4b5563}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.tile{text-align:left;background:#fff;color:#111827;border:1px solid #e5e7eb;padding:16px;min-height:105px}
.tile span{font-size:25px;display:block;margin-bottom:8px}.tile b{display:block}.tile small{display:block;color:#6b7280;margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin-top:10px}.item strong{display:block;margin-bottom:5px}
.meta{color:#6b7280;font-size:14px}.search{margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e5e7eb;border-radius:12px;padding:13px}.stat b{font-size:22px;display:block;margin-top:4px}
.invoice{background:#fff;max-width:800px;margin:auto}.invoice-head{display:flex;justify-content:space-between;gap:15px;border-bottom:2px solid #111827;padding-bottom:14px}
.invoice-title{font-size:28px;font-weight:800}.invoice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}
.invoice-table{width:100%;border-collapse:collapse;margin-top:12px}.invoice-table th,.invoice-table td{padding:9px 5px;border-bottom:1px solid #e5e7eb;text-align:left}
.invoice-table th:last-child,.invoice-table td:last-child{text-align:right}.invoice-total{max-width:330px;margin:15px 0 0 auto}
.invoice-total div{display:flex;justify-content:space-between;padding:6px 0}.invoice-total .grand{border-top:2px solid #111827;font-size:19px;font-weight:800;padding-top:9px}
.invoice-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.form-grid,.invoice-grid,.stats{grid-template-columns:1fr}.section-actions{flex-direction:column}.section-actions button{width:100%}.invoice-head{flex-direction:column}.tile{min-height:100px}}
@media print{body{background:#fff}header,#login,#dash>.top,#dash>.grid,#dash>.connection{display:none!important}main{padding:0;max-width:none}.panel{display:block!important;box-shadow:none;margin:0;padding:0}.invoice-actions{display:none!important}.invoice{max-width:none}}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">MANAGEMENT</div><h1>Oakbank Service Centre</h1></div>
  <button id="logout" class="secondary hidden">Log out</button>
</header>

<main>
<section id="login" class="card">
  <h2>Manager Login</h2>
  <p class="muted">Sign in with your Supabase manager account.</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button>Sign in</button>
    <p id="loginMsg" class="message"></p>
  </form>
</section>

<section id="dash" class="hidden">
  <div class="card top">
    <div class="eyebrow">DASHBOARD</div>
    <h2>Oakbank Service Centre</h2>
    <p class="muted">Jobs, customers, vehicles, payments and shop management.</p>
    <div id="stats" class="stats"></div>
  </div>

  <div id="panel" class="card panel hidden"></div>

  <div class="grid">
    <button class="tile" data-s="jobs"><span>🔧</span><b>Jobs</b><small>Repair jobs & invoices</small></button>
    <button class="tile" data-s="customers"><span>👥</span><b>Customers</b><small>Search, add and edit</small></button>
    <button class="tile" data-s="vehicles"><span>🚗</span><b>Vehicles</b><small>Customer vehicles</small></button>
    <button class="tile" data-s="payments"><span>💰</span><b>Payments</b><small>Payments & balances</small></button>
    <button class="tile" data-s="parts"><span>📦</span><b>Parts</b><small>Parts on jobs</small></button>
    <button class="tile" data-s="expenses"><span>🧾</span><b>Shop Expenses</b><small>Operating expenses</small></button>
    <button class="tile" data-s="reports"><span>📊</span><b>Weekend Reports</b><small>Manager reports</small></button>
  </div>

  <div class="card connection"><b>Connection</b><p id="connection" class="muted">Checking Supabase…</p></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gwzfrsixcdsyczbpmfqq.supabase.co";
const SUPABASE_KEY="sb_publishable_rC6FAks-NitzyqHgdh8z_w_8KfdZVqb";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const login=document.getElementById("login"),dash=document.getElementById("dash"),panel=document.getElementById("panel"),logout=document.getElementById("logout");

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function money(v){return "$"+Number(v||0).toFixed(2)}
function scroll(){setTimeout(function(){panel.scrollIntoView({behavior:"smooth",block:"start"})},40)}
function dashboard(){login.classList.add("hidden");dash.classList.remove("hidden");logout.classList.remove("hidden");document.getElementById("connection").textContent="Connected to Supabase ✓";loadStats()}
function loginScreen(){dash.classList.add("hidden");login.classList.remove("hidden");logout.classList.add("hidden")}

async function loadStats(){
  const [jobs,payments]=await Promise.all([
    db.from("repair_jobs").select("id,status"),
    db.from("payments").select("amount")
  ]);
  if(jobs.error||payments.error)return;
  const open=jobs.data.filter(x=>["Open","approved","estimate"].includes(x.status)).length;
  const progress=jobs.data.filter(x=>["In Progress","in_progress","Waiting for Parts","waiting_parts","Ready","ready"].includes(x.status)).length;
  const completed=jobs.data.filter(x=>["Completed","completed","Picked Up","picked_up"].includes(x.status)).length;
  const revenue=payments.data.reduce((s,x)=>s+Number(x.amount||0),0);
  document.getElementById("stats").innerHTML=
    '<div class="stat"><span>Open</span><b>'+open+'</b></div>'+
    '<div class="stat"><span>In progress</span><b>'+progress+'</b></div>'+
    '<div class="stat"><span>Completed</span><b>'+completed+'</b></div>'+
    '<div class="stat"><span>Payments</span><b>'+money(revenue)+'</b></div>';
}

document.getElementById("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();
  const m=document.getElementById("loginMsg");
  m.style.color="#6b7280";m.textContent="Signing in…";
  const r=await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(r.error){m.style.color="#b91c1c";m.textContent=r.error.message;return}
  m.textContent="";dashboard();
});
logout.addEventListener("click",async function(){await db.auth.signOut();loginScreen();document.getElementById("password").value=""});
db.auth.onAuthStateChange(function(e,s){if(s)dashboard();else loginScreen()});

function panelHeader(title,text,buttons){
  panel.innerHTML="<h3>"+title+"</h3><p class='muted'>"+text+"</p><div class='section-actions'>"+buttons+"</div>";
  panel.classList.remove("hidden");scroll();
}

/* CUSTOMERS */
async function customers(){
  panelHeader("👥 Customers","Search, add and edit customer records.","<button id='newC'>New Customer</button><button id='viewC'>View Customers</button>");
  document.getElementById("newC").onclick=function(){customerForm()};
  document.getElementById("viewC").onclick=viewCustomers;
}
function customerForm(c){
  c=c||{};
  panel.innerHTML="<h3>"+(c.id?"Edit Customer":"New Customer")+"</h3><form id='cf'>"+
  "<label>Name<input id='cn' required value='"+esc(c.name)+"'></label>"+
  "<div class='form-grid'><label>Phone<input id='cp' value='"+esc(c.phone)+"'></label><label>Email<input id='ce' type='email' value='"+esc(c.email)+"'></label></div>"+
  "<label>Address<input id='ca' value='"+esc(c.address)+"'></label><label>Notes<textarea id='cno'>"+esc(c.notes)+"</textarea></label>"+
  "<div class='section-actions'><button>Save Customer</button><button type='button' id='cc' class='secondary'>Cancel</button></div><p id='cm' class='message'></p></form>";
  panel.classList.remove("hidden");scroll();document.getElementById("cc").onclick=customers;
  document.getElementById("cf").onsubmit=async function(e){
    e.preventDefault();const m=document.getElementById("cm");m.style.color="#6b7280";m.textContent="Saving…";
    const data={name:document.getElementById("cn").value.trim(),phone:document.getElementById("cp").value.trim()||null,email:document.getElementById("ce").value.trim()||null,address:document.getElementById("ca").value.trim()||null,notes:document.getElementById("cno").value.trim()||null};
    const r=c.id?await db.from("customers").update(data).eq("id",c.id):await db.from("customers").insert(data);
    if(r.error){m.style.color="#b91c1c";m.textContent=r.error.message;return}
    m.style.color="#166534";m.textContent="Saved ✓";setTimeout(viewCustomers,400);
  };
}
async function viewCustomers(){
  panel.innerHTML="<h3>👥 Customers</h3><p class='muted'>Search and manage customers.</p><input id='cs' class='search' placeholder='Search name, phone or email'><div id='cl'>Loading…</div>";
  panel.classList.remove("hidden");scroll();
  document.getElementById("cs").oninput=function(){loadCustomers(this.value)};loadCustomers("");
}
async function loadCustomers(s){
  let r=db.from("customers").select("*").order("created_at",{ascending:false});
  if(s.trim())r=r.or("name.ilike.%"+s.trim()+"%,phone.ilike.%"+s.trim()+"%,email.ilike.%"+s.trim()+"%");
  const x=await r;if(x.error){document.getElementById("cl").innerHTML="<p class='message'>"+esc(x.error.message)+"</p>";return}
  document.getElementById("cl").innerHTML=x.data.length?x.data.map(function(c){
    return "<div class='item'><strong>"+esc(c.name)+"</strong><div class='meta'>"+esc(c.phone||"No phone")+(c.email?" • "+esc(c.email):"")+"</div>"+(c.address?"<div class='meta'>"+esc(c.address)+"</div>":"")+"<div class='section-actions'><button data-edit='"+c.id+"'>Edit</button></div></div>"
  }).join(""):"<p class='muted'>No customers found.</p>";
  document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){const c=x.data.find(y=>y.id===b.dataset.edit);customerForm(c)}})
}

/* VEHICLES */
async function customerOptions(){
  const r=await db.from("customers").select("id,name,phone").order("name");
  return r.data||[];
}
async function vehicles(){
  panelHeader("🚗 Vehicles","Customer-linked vehicle records.","<button id='newV'>Add Vehicle</button><button id='viewV'>View Vehicles</button>");
  document.getElementById("newV").onclick=function(){vehicleForm()};
  document.getElementById("viewV").onclick=viewVehicles;
}
async function vehicleForm(v){
  const cs=await customerOptions();
  panel.innerHTML="<h3>"+(v?"Edit Vehicle":"Add Vehicle")+"</h3><form id='vf'>"+
  "<label>Customer<select id='vc' required><option value=''>Select customer</option>"+cs.map(c=>"<option value='"+c.id+"' "+(v&&v.customer_id===c.id?"selected":"")+">"+esc(c.name)+" "+esc(c.phone||"")+"</option>").join("")+"</select></label>"+
  "<div class='form-grid'><label>Year<input id='vy' type='number' value='"+esc(v&&v.year)+"'></label><label>Make<input id='vma' value='"+esc(v&&v.make)+"'></label></div>"+
  "<div class='form-grid'><label>Model<input id='vmo' value='"+esc(v&&v.model)+"'></label><label>Trim<input id='vt' value='"+esc(v&&v.trim)+"'></label></div>"+
  "<div class='form-grid'><label>VIN<input id='vvin' value='"+esc(v&&v.vin)+"'></label><label>Plate<input id='vpl' value='"+esc(v&&v.plate)+"'></label></div>"+
  "<label>Mileage<input id='vmi' type='number' value='"+esc(v&&v.mileage)+"'></label><label>Notes<textarea id='vno'>"+esc(v&&v.notes)+"</textarea></label>"+
  "<div class='section-actions'><button>Save Vehicle</button><button type='button' id='vcc' class='secondary'>Cancel</button></div><p id='vm' class='message'></p></form>";
  panel.classList.remove("hidden");scroll();document.getElementById("vcc").onclick=vehicles;
  document.getElementById("vf").onsubmit=async function(e){
    e.preventDefault();
    const data={customer_id:document.getElementById("vc").value,year:Number(document.getElementById("vy").value)||null,make:document.getElementById("vma").value.trim()||null,model:document.getElementById("vmo").value.trim()||null,trim:document.getElementById("vt").value.trim()||null,vin:document.getElementById("vvin").value.trim()||null,plate:document.getElementById("vpl").value.trim()||null,mileage:Number(document.getElementById("vmi").value)||null,notes:document.getElementById("vno").value.trim()||null};
    const r=v?await db.from("vehicles").update(data).eq("id",v.id):await db.from("vehicles").insert(data);
    const m=document.getElementById("vm");if(r.error){m.textContent=r.error.message;return}m.style.color="#166534";m.textContent="Saved ✓";setTimeout(viewVehicles,400)
  }
}
async function viewVehicles(){
  panel.innerHTML="<h3>🚗 Vehicles</h3><p class='muted'>Search and manage vehicles.</p><input id='vs' class='search' placeholder='Search year, make, model, plate or VIN'><div id='vl'>Loading…</div>";
  panel.classList.remove("hidden");scroll();document.getElementById("vs").oninput=function(){loadVehicles(this.value)};loadVehicles("")
}
async function loadVehicles(s){
  const r=await db.from("vehicles").select("*,customers(name,phone)").order("created_at",{ascending:false});
  if(r.error){document.getElementById("vl").textContent=r.error.message;return}
  const a=r.data.filter(v=>!s||[v.year,v.make,v.model,v.plate,v.vin,v.customers&&v.customers.name].join(" ").toLowerCase().includes(s.toLowerCase()));
  document.getElementById("vl").innerHTML=a.length?a.map(function(v){
    return "<div class='item'><strong>"+esc([v.year,v.make,v.model,v.trim].filter(Boolean).join(" ")||"Vehicle")+"</strong><div class='meta'>Customer: "+esc(v.customers&&v.customers.name||"")+" • Plate: "+esc(v.plate||"")+"</div><div class='meta'>VIN: "+esc(v.vin||"")+" • Mileage: "+esc(v.mileage||"")+"</div><div class='section-actions'><button data-ve='"+v.id+"'>Edit</button></div></div>"
  }).join(""):"<p class='muted'>No vehicles found.</p>";
  document.querySelectorAll("[data-ve]").forEach(function(b){b.onclick=function(){const v=r.data.find(x=>x.id===b.dataset.ve);vehicleForm(v)}})
}

/* JOBS */
async function jobOptions(){
  const r=await db.from("repair_jobs").select("id,job_number,description,customers(name)").order("created_at",{ascending:false});
  return r.data||[];
}
async function jobForm(job){
  const cs=await customerOptions();
  panel.innerHTML="<h3>"+(job?"Edit Job":"New Repair Job")+"</h3><form id='jf'>"+
  "<label>Customer<select id='jc' required><option value=''>Select customer</option>"+cs.map(c=>"<option value='"+c.id+"' "+(job&&job.customer_id===c.id?"selected":"")+">"+esc(c.name)+" "+esc(c.phone||"")+"</option>").join("")+"</select></label>"+
  "<label>Vehicle<select id='jv'><option value=''>Select vehicle</option></select></label>"+
  "<label>Repair Description<textarea id='jd' required>"+esc(job&&job.description)+"</textarea></label>"+
  "<div class='form-grid'><label>Estimate ($)<input id='je' type='number' min='0' step='0.01' value='"+esc(job&&job.estimate_amount||0)+"'></label><label>Final Amount ($)<input id='jfina' type='number' min='0' step='0.01' value='"+esc(job&&job.final_amount||0)+"'></label></div>"+
  "<div class='form-grid'><label>Parts Cost ($)<input id='jpc' type='number' min='0' step='0.01' value='"+esc(job&&job.parts_cost||0)+"'></label><label>Labour ($)<input id='jl' type='number' min='0' step='0.01' value='"+esc(job&&job.labour_amount||0)+"'></label></div>"+
  "<div class='form-grid'><label>Status<select id='js'><option>Open</option><option>In Progress</option><option>Waiting for Parts</option><option>Ready</option><option>Completed</option><option>Picked Up</option><option>Cancelled</option></select></label><label>Expected Completion<input id='jec' type='date' value='"+esc(job&&job.expected_completion)+"'></label></div>"+
  "<label>Technician<input id='jt' value='"+esc(job&&job.technician)+"'></label><label>Notes<textarea id='jn'>"+esc(job&&job.notes)+"</textarea></label>"+
  "<div class='section-actions'><button>Save Job</button><button type='button' id='jcc' class='secondary'>Cancel</button></div><p id='jm' class='message'></p></form>";
  panel.classList.remove("hidden");scroll();document.getElementById("jcc").onclick=jobs;
  if(job)document.getElementById("js").value=job.status||"Open";
  async function loadJV(){
    const id=document.getElementById("jc").value;
    const r=await db.from("vehicles").select("id,year,make,model,plate").eq("customer_id",id).order("created_at");
    const sel=document.getElementById("jv");
    sel.innerHTML="<option value=''>Select vehicle</option>"+(r.data||[]).map(v=>"<option value='"+v.id+"'>"+esc([v.year,v.make,v.model].filter(Boolean).join(" "))+" "+esc(v.plate||"")+"</option>").join("");
    if(job)sel.value=job.vehicle_id||""
  }
  document.getElementById("jc").onchange=loadJV;if(job)loadJV();
  document.getElementById("jf").onsubmit=async function(e){
    e.preventDefault();
    const data={customer_id:document.getElementById("jc").value,vehicle_id:document.getElementById("jv").value||null,description:document.getElementById("jd").value.trim(),status:document.getElementById("js").value,estimate_amount:Number(document.getElementById("je").value)||0,final_amount:Number(document.getElementById("jfina").value)||0,parts_cost:Number(document.getElementById("jpc").value)||0,labour_amount:Number(document.getElementById("jl").value)||0,expected_completion:document.getElementById("jec").value||null,technician:document.getElementById("jt").value.trim()||null,notes:document.getElementById("jn").value.trim()||null};
    const r=job?await db.from("repair_jobs").update(data).eq("id",job.id):await db.from("repair_jobs").insert(data).select("job_number").single();
    const m=document.getElementById("jm");if(r.error){m.textContent=r.error.message;return}
    m.style.color="#166534";m.textContent="Job saved "+(r.data&&r.data.job_number?"— Job #"+r.data.job_number:"")+" ✓";loadStats();setTimeout(viewJobs,500)
  }
}
async function jobs(){
  panelHeader("🔧 Jobs","Create, edit, update and invoice repair jobs.","<button id='nj'>New Job</button><button id='vj'>View Jobs</button>");
  document.getElementById("nj").onclick=function(){jobForm()};document.getElementById("vj").onclick=viewJobs
}
async function viewJobs(){
  const r=await db.from("repair_jobs").select("*,customers(name,phone),vehicles(year,make,model,plate)").order("created_at",{ascending:false});
  panel.innerHTML="<h3>🔧 Jobs</h3><p class='muted'>Search jobs and open invoices.</p><input id='jsearch' class='search' placeholder='Search job number, customer, vehicle or status'><div id='jlst'>Loading…</div>";
  panel.classList.remove("hidden");scroll();
  function draw(s){
    const a=(r.data||[]).filter(j=>!s||[j.job_number,j.status,j.description,j.customers&&j.customers.name,j.vehicles&&j.vehicles.make,j.vehicles&&j.vehicles.model].join(" ").toLowerCase().includes(s.toLowerCase()));
    document.getElementById("jlst").innerHTML=a.length?a.map(j=>"<div class='item'><strong>Job #"+esc(j.job_number)+" — "+esc(j.customers&&j.customers.name||"")+"</strong><div class='meta'>"+esc([j.vehicles&&j.vehicles.year,j.vehicles&&j.vehicles.make,j.vehicles&&j.vehicles.model].filter(Boolean).join(" "))+" • "+esc(j.vehicles&&j.vehicles.plate||"")+"</div><div>"+esc(j.description)+"</div><div class='meta'>Status: <b>"+esc(j.status)+"</b> • Total: "+money(j.final_amount||j.estimate_amount)+"</div><div class='section-actions'><button data-je='"+j.id+"'>Edit</button><button data-inv='"+j.id+"'>Invoice / Print</button></div></div>").join(""):"<p class='muted'>No jobs found.</p>";
    document.querySelectorAll("[data-je]").forEach(b=>b.onclick=function(){jobForm((r.data||[]).find(x=>x.id===b.dataset.je))});
    document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=function(){invoice(b.dataset.inv)})
  }
  if(r.error){document.getElementById("jlst").textContent=r.error.message;return}
  document.getElementById("jsearch").oninput=function(){draw(this.value)};draw("")
}

/* PARTS */
async function parts(){
  panelHeader("📦 Parts","Add parts to repair jobs and review job parts.","<button id='ap'>Add Part</button><button id='vp'>View Parts</button>");
  document.getElementById("ap").onclick=partForm;document.getElementById("vp").onclick=viewParts
}
async function partForm(){
  const jobs=await jobOptions();
  panel.innerHTML="<h3>📦 Add Part</h3><form id='pf'><label>Job<select id='pj' required><option value=''>Select job</option>"+jobs.map(j=>"<option value='"+j.id+"'>#"+j.job_number+" — "+esc(j.customers&&j.customers.name||"")+" — "+esc(j.description||"")+"</option>").join("")+"</select></label><div class='form-grid'><label>Part Name<input id='pn' required></label><label>Part Number<input id='ppn'></label></div><label>Supplier<input id='ps'></label><div class='form-grid'><label>Quantity<input id='pq' type='number' min='1' value='1'></label><label>Cost ($)<input id='pc' type='number' min='0' step='0.01' value='0'></label></div><label>Selling Price ($)<input id='psp' type='number' min='0' step='0.01' value='0'></label><div class='section-actions'><button>Add Part</button><button type='button' id='pcc' class='secondary'>Cancel</button></div><p id='pm' class='message'></p></form>";
  panel.classList.remove("hidden");scroll();document.getElementById("pcc").onclick=parts;
  document.getElementById("pf").onsubmit=async function(e){
    e.preventDefault();

/* INVOICE */
async function invoice(jobId){
  const [jr,pr,payr]=await Promise.all([
    db.from("repair_jobs").select("*,customers(name,phone,email,address),vehicles(year,make,model,trim,vin,plate,mileage)").eq("id",jobId).single(),
    db.from("job_parts").select("*").eq("job_id",jobId).order("created_at"),
    db.from("payments").select("*").eq("job_id",jobId).order("payment_date")
  ]);
  if(jr.error){panel.innerHTML="<p class='message'>"+esc(jr.error.message)+"</p>";return}
  const j=jr.data,c=j.customers||{},v=j.vehicles||{},parts=pr.data||[],pays=payr.data||[];
  const partsTotal=parts.reduce((s,x)=>s+Number(x.sell_price||x.cost||0)*Number(x.quantity||1),0);
  const total=Number(j.final_amount||0)||Number(j.estimate_amount||0)||partsTotal+Number(j.labour_amount||0);
  const paid=pays.reduce((s,x)=>s+Number(x.amount||0),0),balance=Math.max(total-paid,0);
  const veh=[v.year,v.make,v.model,v.trim].filter(Boolean).join(" ");

  panel.innerHTML="<div class='invoice'>"+
  "<div class='invoice-head'><div><div class='eyebrow'>OAKBANK SERVICE CENTRE</div><div class='invoice-title'>INVOICE</div></div><div><b>Job #"+esc(j.job_number)+"</b><br><span class='meta'>Date: "+esc(j.date_received)+"</span></div></div>"+
  "<div class='invoice-grid'><div><b>Customer</b><br>"+esc(c.name)+"<br>"+esc(c.phone||"")+(c.email?"<br>"+esc(c.email):"")+(c.address?"<br>"+esc(c.address):"")+"</div>"+
  "<div><b>Vehicle</b><br>"+esc(veh)+"<br>Plate: "+esc(v.plate||"")+(v.vin?"<br>VIN: "+esc(v.vin):"")+(v.mileage?"<br>Mileage: "+esc(v.mileage):"")+"</div></div>"+
  "<b>Repair Description</b><p>"+esc(j.description)+"</p>"+
  "<table class='invoice-table'><thead><tr><th>Description</th><th>Qty</th><th>Amount</th></tr></thead><tbody>"+
  (parts.map(x=>"<tr><td>"+esc(x.part_name)+(x.part_number?"<br><small>"+esc(x.part_number)+"</small>":"")+"</td><td>"+x.quantity+"</td><td>"+money(Number(x.sell_price||x.cost||0)*Number(x.quantity||1))+"</td></tr>").join("")||"")+
  "<tr><td>Labour</td><td>—</td><td>"+money(j.labour_amount)+"</td></tr></tbody></table>"+
  "<div class='invoice-total'><div><span>Total</span><span>"+money(total)+"</span></div><div><span>Paid</span><span>"+money(paid)+"</span></div><div class='grand'><span>Balance Due</span><span>"+money(balance)+"</span></div></div>"+
  (pays.length?"<p class='meta'><b>Payments:</b> "+pays.map(x=>esc(x.payment_method)+" "+money(x.amount)+" ("+esc(x.payment_date)+")").join(" • ")+"</p>":"")+
  (j.notes?"<p><b>Notes:</b> "+esc(j.notes)+"</p>":"")+
  "<div class='invoice-actions'><button id='print'>🖨️ Print Invoice</button><button id='share' class='secondary'>📤 Share Invoice</button><button id='back' class='secondary'>Back to Jobs</button></div></div>";
  panel.classList.remove("hidden");scroll();

  document.getElementById("print").onclick=function(){window.print()};
  document.getElementById("share").onclick=function(){
    const t="Oakbank Service Centre - Invoice\nJob #"+j.job_number+"\nCustomer: "+(c.name||"")+"\nVehicle: "+veh+"\nRepair: "+(j.description||"")+"\nTotal: "+money(total)+"\nPaid: "+money(paid)+"\nBalance Due: "+money(balance);
    if(navigator.share)navigator.share({title:"Invoice #"+j.job_number,text:t}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert("Invoice summary copied. You can paste it into WhatsApp, text or email.")});
  };
  document.getElementById("back").onclick=viewJobs;
}

const handlers={jobs:jobs,customers:customers,vehicles:vehicles,payments:payments,parts:parts,expenses:expenses,reports:reports};
document.querySelectorAll(".tile").forEach(function(b){b.onclick=function(){handlers[b.dataset.s]()}});
(async function(){const r=await db.auth.getSession();if(r.data&&r.data.session)dashboard();else loginScreen()})();
</script>
