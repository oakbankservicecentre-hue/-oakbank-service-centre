 <!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oakbank Service Centre</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
header{background:#111827;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:15px}
.card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:18px;text-align:left;background:white;color:#111827;border:1px solid #ddd;border-radius:10px}.tile span{font-size:24px}.tile b,.tile small{display:block;margin-top:5px}.tile small,.muted{color:#6b7280}
label{display:block;font-weight:bold;margin:10px 0}input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:15px}textarea{min-height:80px}
button{background:#111827;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}.secondary{background:#6b7280}.danger{background:#b91c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #ddd;border-radius:9px;padding:12px;margin-top:9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #ddd;padding:10px;border-radius:8px}.stat b{display:block;font-size:20px;margin-top:4px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.totals{max-width:350px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{border-top:2px solid #111;padding-top:8px;font-weight:bold;font-size:18px}
.hidden{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.formgrid,.stats{grid-template-columns:1fr}.actions button{width:100%}}@media print{header,#login,.dashnav,.actions{display:none!important}body{background:white}.card{box-shadow:none}}
</style></head>
<body>
<header><div><small>MANAGEMENT & BOOKKEEPING</small><h2>Oakbank Service Centre</h2></div><button id="logout" class="secondary hidden">Log out</button></header>
<main>
<section id="login" class="card"><h2>Manager Login</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button><p id="loginMsg"></p></form></section>
<section id="app" class="hidden">
<div class="card"><div id="stats" class="stats"></div></div>
<div id="panel" class="card hidden"></div>
<div class="grid">
<button class="tile" data-s="customers"><span>👥</span><b>Customers</b><small>Customer records</small></button>
<button class="tile" data-s="vehicles"><span>🚗</span><b>Vehicles</b><small>Customer vehicles</small></button>
<button class="tile" data-s="estimates"><span>📝</span><b>Estimates</b><small>Optional — quote first</small></button>
<button class="tile" data-s="invoices"><span>🧾</span><b>Invoices</b><small>Direct invoice — no estimate required</small></button>
<button class="tile" data-s="jobs"><span>🔧</span><b>Jobs</b><small>Repair jobs</small></button>
<button class="tile" data-s="parts"><span>🔩</span><b>Parts</b><small>Cost & margin</small></button>
<button class="tile" data-s="payments"><span>💵</span><b>Payments</b><small>Money received</small></button>
<button class="tile" data-s="expenses"><span>💳</span><b>Shop Expenses</b><small>Variable expenses</small></button>
<button class="tile" data-s="fixed"><span>🏢</span><b>Fixed Expenses</b><small>Recurring expenses</small></button>
<button class="tile" data-s="technicians"><span>👨‍🔧</span><b>Technician Hours</b><small>Labour cost</small></button>
<button class="tile" data-s="bookkeeping"><span>📚</span><b>Bookkeeping</b><small>P&L and GST/PST</small></button>
<button class="tile" data-s="scan"><span>📷</span><b>Supplier Scanner</b><small>OCR review</small></button>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://gwzfrsixcdsyczbpmfqq.supabase.co","sb_publishable_rC6FAks-NitzyqHgdh8z_w_8KfdZVqb",{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),P=$("panel"),GST=.05,PST=.07;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),money=v=>"$"+Number(v||0).toFixed(2);
const tax=(n,g,p)=>({gst:g?Number(n)*GST:0,pst:p?Number(n)*PST:0});
function show(){P.classList.remove("hidden");P.scrollIntoView({behavior:"smooth"})}
async function opts(){return (await db.from("customers").select("id,name").order("name")).data||[]}
async function veh(cid){return (await db.from("vehicles").select("id,year,make,model,plate").eq("customer_id",cid)).data||[]}
async function stats(){let j=(await db.from("repair_jobs").select("status")).data||[],p=(await db.from("payments").select("amount")).data||[],i=(await db.from("invoices").select("total,status")).data||[];$("stats").innerHTML='<div class=stat>Jobs<b>'+j.length+'</b></div><div class=stat>Open<b>'+j.filter(x=>!["Completed","Picked Up","Cancelled"].includes(x.status)).length+'</b></div><div class=stat>Payments<b>'+money(p.reduce((a,x)=>a+Number(x.amount),0))+'</b></div><div class=stat>Unpaid<b>'+money(i.filter(x=>x.status!="Paid").reduce((a,x)=>a+Number(x.total),0))+'</b></div>'}
function shell(){login.classList.add("hidden");app.classList.remove("hidden");logout.classList.remove("hidden");stats()}function out(){app.classList.add("hidden");login.classList.remove("hidden");logout.classList.add("hidden")}
loginForm.onsubmit=async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)loginMsg.textContent=r.error.message;else shell()};logout.onclick=async()=>{await db.auth.signOut();out()};db.auth.onAuthStateChange((e,s)=>s?shell():out());

async function customers(){P.innerHTML='<h2>👥 Customers</h2><button onclick="customerForm()">New Customer</button><button class=secondary onclick="customerList()">View Customers</button>';show()}
function customerForm(c={}){P.innerHTML='<h2>'+(c.id?"Edit":"New")+' Customer</h2><form id=f><label>Name<input id=n required value="'+esc(c.name)+'"></label><label>Phone<input id=ph value="'+esc(c.phone)+'"></label><label>Email<input id=em value="'+esc(c.email)+'"></label><label>Address<input id=ad value="'+esc(c.address)+'"></label><label>Notes<textarea id=no>'+esc(c.notes)+'</textarea></label><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let d={name:n.value,phone:ph.value||null,email:em.value||null,address:ad.value||null,notes:no.value||null};await(c.id?db.from("customers").update(d).eq("id",c.id):db.from("customers").insert(d));customerList()}}
async function customerList(){let a=(await db.from("customers").select("*").order("created_at",{ascending:false})).data||[];P.innerHTML="<h2>Customers</h2>"+a.map(c=>'<div class=item><b>'+esc(c.name)+'</b><div>'+esc(c.phone||'')+'</div><button onclick=\'customerForm('+JSON.stringify(c).replace(/'/g,"&#39;")+')\'>Edit</button></div>').join("");show()}
async function vehicles(){P.innerHTML='<h2>🚗 Vehicles</h2><button onclick="vehicleForm()">New Vehicle</button><button class=secondary onclick="vehicleList()">View Vehicles</button>';show()}
async function vehicleForm(v={}){let c=await opts();P.innerHTML='<h2>Vehicle</h2><form id=f><label>Customer<select id=cid required><option value="">Select</option>'+c.map(x=>'<option value="'+x.id+'" '+(v.customer_id==x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></label><div class=formgrid><label>Year<input id=y value="'+esc(v.year)+'"></label><label>Make<input id=mk value="'+esc(v.make)+'"></label><label>Model<input id=mo value="'+esc(v.model)+'"></label><label>VIN<input id=vin value="'+esc(v.vin)+'"></label><label>Plate<input id=pl value="'+esc(v.plate)+'"></label><label>Mileage<input id=mi value="'+esc(v.mileage)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let d={customer_id:cid.value,year:+y.value||null,make:mk.value,model:mo.value,vin:vin.value,plate:pl.value,mileage:+mi.value||null};await(v.id?db.from("vehicles").update(d).eq("id",v.id):db.from("vehicles").insert(d));vehicleList()}}
async function vehicleList(){let a=(await db.from("vehicles").select("*,customers(name)").order("created_at",{ascending:false})).data||[];P.innerHTML="<h2>Vehicles</h2>"+a.map(v=>'<div class=item><b>'+esc([v.year,v.make,v.model].filter(Boolean).join(" "))+'</b><div>'+esc(v.customers?.name||'')+' • '+esc(v.vin||'')+'</div><button onclick=\'vehicleForm('+JSON.stringify(v).replace(/'/g,"&#39;")+')\'>Edit</button></div>').join("");show()}

async function estimates(){P.innerHTML='<h2>📝 Estimates</h2><p class=muted>Separate from invoices. Use only when you want to quote before doing the work.</p><button onclick="estimateForm()">New Estimate</button><button class=secondary onclick="estimateList()">View Estimates</button>';show()}
async function estimateForm(){let c=await opts();P.innerHTML='<h2>New Estimate</h2><form id=f><label>Customer<select id=cid required><option value="">Select</option>'+c.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Vehicle<select id=vid><option value="">Select customer first</option></select></label><label>Date<input id=dt type=date value="'+new Date().toISOString().slice(0,10)+'"></label><label>Notes<textarea id=no></textarea></label><button>Save Estimate</button></form>';show();cid.onchange=async()=>{let a=await veh(cid.value);vid.innerHTML='<option value="">Select</option>'+a.map(x=>'<option value="'+x.id+'">'+esc([x.year,x.make,x.model].filter(Boolean).join(" "))+'</option>').join("")};f.onsubmit=async e=>{e.preventDefault();let r=await db.from("estimates").insert({customer_id:cid.value,vehicle_id:vid.value||null,estimate_date:dt.value,notes:no.value||null}).select().single();if(r.error)alert(r.error.message);else estimateOpen(r.data.id)}}
async function estimateOpen(id){let e=(await db.from("estimates").select("*,customers(name)").eq("id",id).single()).data,a=(await db.from("estimate_items").select("*").eq("estimate_id",id)).data||[],sub=a.reduce((s,x)=>s+x.unit_price*x.quantity,0),g=a.reduce((s,x)=>s+x.gst_amount,0),p=a.reduce((s,x)=>s+x.pst_amount,0);await db.from("estimates").update({subtotal:sub,gst_amount:g,pst_amount:p,total:sub+g+p}).eq("id",id);P.innerHTML='<h2>Estimate #'+e.estimate_number+'</h2><p><b>'+esc(e.customers?.name||'')+'</b></p><div class=actions><button onclick="estimateLine(''+id+'')">Add Line</button><button onclick="estimateToInvoice(''+id+'')">Convert to Invoice</button><button onclick="print()">Print Estimate</button><button class=secondary onclick="estimates()">Back</button></div><table class=table><tr><th>Description</th><th>Qty</th><th>Amount</th></tr>'+a.map(x=>'<tr><td>'+esc(x.description)+'</td><td>'+x.quantity+'</td><td>'+money(x.unit_price*x.quantity)+'</td></tr>').join("")+'</table><div class=totals><div>Subtotal <b>'+money(sub)+'</b></div><div>GST <b>'+money(g)+'</b></div><div>PST <b>'+money(p)+'</b></div><div class=grand>Total <b>'+money(sub+g+p)+'</b></div></div>';show()}
async function estimateLine(id){let d=prompt("Description");if(d===null)return;let q=+prompt("Quantity","1"),u=+prompt("Unit price","0"),g=confirm("GST?"),p=confirm("PST?"),z=tax(q*u,g,p);await db.from("estimate_items").insert({estimate_id:id,item_type:"other",description:d,quantity:q,unit_price:u,gst_enabled:g,pst_enabled:p,gst_amount:z.gst,pst_amount:z.pst});estimateOpen(id)}
async function estimateList(){let a=(await db.from("estimates").select("*,customers(name)").order("created_at",{ascending:false})).data||[];P.innerHTML="<h2>Estimates</h2>"+a.map(e=>'<div class=item><b>Estimate #'+e.estimate_number+' — '+esc(e.customers?.name||'')+'</b><div>'+money(e.total)+'</div><button onclick="estimateOpen(\''+e.id+'\')">Open</button></div>').join("");show()}
async function estimateToInvoice(id){let e=(await db.from("estimates").select("*").eq("id",id).single()).data,r=await db.from("invoices").insert({estimate_id:id,customer_id:e.customer_id,vehicle_id:e.vehicle_id,subtotal:e.subtotal,gst_amount:e.gst_amount,pst_amount:e.pst_amount,total:e.total,notes:e.notes}).select().single();if(r.error)return alert(r.error.message);let a=(await db.from("estimate_items").select("*").eq("estimate_id",id)).data||[];if(a.length)await db.from("invoice_items").insert(a.map(x=>({invoice_id:r.data.id,item_type:x.item_type,description:x.description,quantity:x.quantity,actual_cost:x.actual_cost,unit_price:x.unit_price,gst_enabled:x.gst_enabled,pst_enabled:x.pst_enabled,gst_amount:x.gst_amount,pst_amount:x.pst_amount})));await db.from("estimates").update({status:"Approved"}).eq("id",id);invoiceOpen(r.data.id)}

async function invoices(){P.innerHTML='<h2>🧾 Invoices</h2><p class=muted><b>Direct invoices are independent.</b> You do NOT need to create an estimate first.</p><button onclick="invoiceForm()">New Invoice</button><button class=secondary onclick="invoiceList()">View Invoices</button>';show()}
async function invoiceForm(){let c=await opts();P.innerHTML='<h2>New Invoice — Direct</h2><p class=muted>This invoice can be created without an estimate.</p><form id=f><label>Customer<select id=cid required><option value="">Select</option>'+c.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Vehicle<select id=vid><option value="">Select customer first</option></select></label><label>Invoice date<input id=dt type=date value="'+new Date().toISOString().slice(0,10)+'"></label><label>Notes<textarea id=no></textarea></label><button>Create Invoice Directly</button></form>';show();cid.onchange=async()=>{let a=await veh(cid.value);vid.innerHTML='<option value="">Select</option>'+a.map(x=>'<option value="'+x.id+'">'+esc([x.year,x.make,x.model].filter(Boolean).join(" "))+'</option>').join("")};f.onsubmit=async e=>{e.preventDefault();let r=await db.from("invoices").insert({customer_id:cid.value,vehicle_id:vid.value||null,invoice_date:dt.value,notes:no.value||null}).select().single();if(r.error)alert(r.error.message);else invoiceOpen(r.data.id)}}
async function invoiceOpen(id){let i=(await db.from("invoices").select("*,customers(name),vehicles(year,make,model)").eq("id",id).single()).data,a=(await db.from("invoice_items").select("*").eq("invoice_id",id)).data||[],sub=a.reduce((s,x)=>s+x.unit_price*x.quantity,0),g=a.reduce((s,x)=>s+x.gst_amount,0),p=a.reduce((s,x)=>s+x.pst_amount,0);await db.from("invoices").update({subtotal:sub,gst_amount:g,pst_amount:p,total:sub+g+p}).eq("id",id);let pays=(await db.from("payments").select("amount").eq("invoice_id",id)).data||[],paid=pays.reduce((s,x)=>s+Number(x.amount),0);P.innerHTML='<div class=invoice><h2>Invoice #'+i.invoice_number+'</h2><p><b>'+esc(i.customers?.name||'')+'</b><br>'+esc([i.vehicles?.year,i.vehicles?.make,i.vehicles?.model].filter(Boolean).join(" "))+'</p><div class=actions><button onclick="invoiceLine(\''+id+'')">Add Line</button><button onclick="invoicePayment(\''+id+'')">Record Payment</button><button onclick="print()">Print / Save PDF</button><button class=secondary onclick="invoices()">Back</button></div><table class=table><tr><th>Description</th><th>Qty</th><th>Amount</th></tr>'+a.map(x=>'<tr><td>'+esc(x.description)+'</td><td>'+x.quantity+'</td><td>'+money(x.unit_price*x.quantity)+'</td></tr>').join("")+'</table><div class=totals><div>Subtotal <b>'+money(sub)+'</b></div><div>GST <b>'+money(g)+'</b></div><div>PST <b>'+money(p)+'</b></div><div>Total <b>'+money(sub+g+p)+'</b></div><div>Paid <b>'+money(paid)+'</b></div><div class=grand>Balance <b>'+money(Math.max(0,sub+g+p-paid))+'</b></div></div></div>';show()}
async function invoiceLine(id){let d=prompt("Description");if(d===null)return;let q=+prompt("Quantity","1"),u=+prompt("Unit price","0"),g=confirm("GST?"),p=confirm("PST?"),z=tax(q*u,g,p);await db.from("invoice_items").insert({invoice_id:id,item_type:"other",description:d,quantity:q,unit_price:u,gst_enabled:g,pst_enabled:p,gst_amount:z.gst,pst_amount:z.pst});invoiceOpen(id)}
async function invoicePayment(id){let a=+prompt("Payment amount","0");if(!a)return;let m=prompt("cash, debit, credit, etransfer, other","debit"),g=confirm("GST applies?"),p=confirm("PST applies?"),z=tax(a,g,p);await db.from("payments").insert({invoice_id:id,amount:a,payment_method:m,payment_date:new Date().toISOString().slice(0,10),gst_enabled:g,pst_enabled:p,gst_amount:z.gst,pst_amount:z.pst});invoiceOpen(id)}
async function invoiceList(){let a=(await db.from("invoices").select("*,customers(name)").order("invoice_date",{ascending:false})).data||[];P.innerHTML="<h2>Invoices</h2>"+a.map(i=>'<div class=item><b>Invoice #'+i.invoice_number+' — '+esc(i.customers?.name||'')+'</b><div>'+money(i.total)+' • '+esc(i.status)+'</div><button onclick="invoiceOpen(\''+i.id+'\')">Open</button></div>').join("");show()}

async function parts(){P.innerHTML='<h2>🔩 Parts</h2><button onclick="partForm()">New Part</button><button class=secondary onclick="partList()">View Parts</button>';show()}
function partForm(p={}){P.innerHTML='<h2>'+(p.id?"Edit":"New")+' Part</h2><form id=f><div class=formgrid><label>Part number<input id=pn value="'+esc(p.part_number)+'"></label><label>Part name<input id=nm required value="'+esc(p.part_name)+'"></label><label>Supplier<input id=sp value="'+esc(p.supplier)+'"></label><label>Actual cost<input id=co type=number step=.01 value="'+esc(p.actual_cost||0)+'"></label><label>Margin %<input id=ma type=number step=.01 value="'+esc(p.margin_percent||30)+'"></label><label>Sold price<input id=so type=number step=.01 value="'+esc(p.sold_price||0)+'"></label></div><div class=formgrid><label>Purchase GST<input id=pg type=number step=.01 value="'+esc(p.purchase_gst||0)+'"></label><label>Purchase PST<input id=pp type=number step=.01 value="'+esc(p.purchase_pst||0)+'"></label><label>Sale GST<input id=sg type=number step=.01 value="'+esc(p.sold_gst||0)+'"></label><label>Sale PST<input id=spt type=number step=.01 value="'+esc(p.sold_pst||0)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let d={part_number:pn.value||null,part_name:nm.value,supplier:sp.value||null,actual_cost:+co.value||0,margin_percent:+ma.value||0,sold_price:+so.value||0,purchase_gst:+pg.value||0,purchase_pst:+pp.value||0,sold_gst:+sg.value||0,sold_pst:+spt.value||0};await(p.id?db.from("parts_catalog").update(d).eq("id",p.id):db.from("parts_catalog").insert(d));partList()}}
async function partList(){let a=(await db.from("parts_catalog").select("*").order("part_name")).data||[];P.innerHTML="<h2>Parts</h2>"+a.map(p=>'<div class=item><b>'+esc(p.part_name)+'</b><div>Cost '+money(p.actual_cost)+' → Sell '+money(p.sold_price)+' • Margin '+p.margin_percent+'%</div><button onclick=\'partForm('+JSON.stringify(p).replace(/'/g,"&#39;")+')\'>Edit</button></div>').join("");show()}

async function payments(){P.innerHTML='<h2>💵 Payments</h2><button onclick="paymentForm()">New Payment</button><button class=secondary onclick="paymentList()">View Payments</button>';show()}
async function paymentForm(){let a=(await db.from("invoices").select("id,invoice_number,total").order("created_at",{ascending:false})).data||[];P.innerHTML='<h2>New Payment</h2><form id=f><label>Invoice<select id=i required>'+a.map(x=>'<option value="'+x.id+'">#'+x.invoice_number+' — '+money(x.total)+'</option>').join("")+'</select></label><label>Amount<input id=a type=number step=.01 required></label><label>Method<select id=m><option>cash</option><option>debit</option><option>credit</option><option>etransfer</option><option>other</option></select></label><div class=formgrid><label>GST applies?<select id=g><option value=false>No</option><option value=true>Yes</option></select></label><label>PST applies?<select id=p><option value=false>No</option><option value=true>Yes</option></select></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let z=tax(+a.value,g.value==="true",p.value==="true");await db.from("payments").insert({invoice_id:i.value,amount:+a.value,payment_method:m.value,payment_date:new Date().toISOString().slice(0,10),gst_enabled:g.value==="true",pst_enabled:p.value==="true",gst_amount:z.gst,pst_amount:z.pst});paymentList()}}
async function paymentList(){let a=(await db.from("payments").select("*,invoices(invoice_number)").order("payment_date",{ascending:false})).data||[];P.innerHTML="<h2>Payments</h2>"+a.map(x=>'<div class=item><b>'+money(x.amount)+' — '+esc(x.payment_method)+'</b><div>Invoice #'+esc(x.invoices?.invoice_number||'')+' • GST '+money(x.gst_amount)+' • PST '+money(x.pst_amount)+'</div></div>').join("");show()}

async function expenses(){P.innerHTML='<h2>💳 Shop Expenses</h2><button onclick="expenseForm()">New Expense</button><button class=secondary onclick="expenseList()">View Expenses</button>';show()}
function expenseForm(x={}){P.innerHTML='<h2>'+(x.id?"Edit":"New")+' Expense</h2><form id=f><div class=formgrid><label>Date<input id=d type=date value="'+(x.expense_date||new Date().toISOString().slice(0,10))+'"></label><label>Category<input id=c value="'+esc(x.category)+'"></label><label>Description<input id=de value="'+esc(x.description)+'"></label><label>Amount<input id=a type=number step=.01 value="'+esc(x.amount||0)+'"></label><label>GST<input id=g type=number step=.01 value="'+esc(x.gst_amount||0)+'"></label><label>PST<input id=p type=number step=.01 value="'+esc(x.pst_amount||0)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let z={expense_date:d.value,category:c.value,description:de.value,amount:+a.value||0,gst_amount:+g.value||0,pst_amount:+p.value||0,expense_type:"variable"};await(x.id?db.from("shop_expenses").update(z).eq("id",x.id):db.from("shop_expenses").insert(z));expenseList()}}
async function expenseList(){let a=(await db.from("shop_expenses").select("*").eq("expense_type","variable").order("expense_date",{ascending:false})).data||[];P.innerHTML="<h2>Expenses</h2>"+a.map(x=>'<div class=item><b>'+money(x.amount)+' — '+esc(x.category)+'</b><div>GST '+money(x.gst_amount)+' • PST '+money(x.pst_amount)+'</div><button onclick=\'expenseForm('+JSON.stringify(x).replace(/'/g,"&#39;")+')\'>Edit</button></div>').join("");show()}

async function fixed(){P.innerHTML='<h2>🏢 Fixed Expenses</h2><button onclick="fixedForm()">New Fixed Expense</button><button class=secondary onclick="fixedList()">View Fixed Expenses</button>';show()}
function fixedForm(x={}){P.innerHTML='<h2>Fixed Expense</h2><form id=f><label>Name<input id=n required value="'+esc(x.name)+'"></label><div class=formgrid><label>Amount<input id=a type=number step=.01 value="'+esc(x.amount||0)+'"></label><label>Frequency<select id=q><option>monthly</option><option>weekly</option><option>annual</option></select></label></div><div class=formgrid><label>GST<input id=g type=number step=.01 value="'+esc(x.gst_amount||0)+'"></label><label>PST<input id=p type=number step=.01 value="'+esc(x.pst_amount||0)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let z={name:n.value,amount:+a.value||0,frequency:q.value,gst_amount:+g.value||0,pst_amount:+p.value||0};await(x.id?db.from("fixed_expenses").update(z).eq("id",x.id):db.from("fixed_expenses").insert(z));fixedList()}}
async function fixedList(){let a=(await db.from("fixed_expenses").select("*").order("name")).data||[];P.innerHTML="<h2>Fixed Expenses</h2>"+a.map(x=>'<div class=item><b>'+esc(x.name)+'</b><div>'+money(x.amount)+' / '+x.frequency+'</div></div>').join("");show()}

async function technicians(){P.innerHTML='<h2>👨‍🔧 Technician Hours</h2><button onclick="techForm()">New Technician</button><button class=secondary onclick="techList()">Technicians</button><button class=secondary onclick="hoursForm()">Add Hours</button>';show()}
function techForm(x={}){P.innerHTML='<h2>Technician</h2><form id=f><label>Name<input id=n required value="'+esc(x.name)+'"></label><div class=formgrid><label>Cost/hour<input id=c type=number step=.01 value="'+esc(x.cost_per_hour||0)+'"></label><label>Bill/hour<input id=b type=number step=.01 value="'+esc(x.default_bill_rate||0)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();await(x.id?db.from("technicians").update({name:n.value,cost_per_hour:+c.value||0,default_bill_rate:+b.value||0}).eq("id",x.id):db.from("technicians").insert({name:n.value,cost_per_hour:+c.value||0,default_bill_rate:+b.value||0}));techList()}}
async function techList(){let a=(await db.from("technicians").select("*").order("name")).data||[];P.innerHTML="<h2>Technicians</h2>"+a.map(x=>'<div class=item><b>'+esc(x.name)+'</b> • Cost '+money(x.cost_per_hour)+'/hr • Bill '+money(x.default_bill_rate)+'/hr</div>').join("");show()}
async function hoursForm(){let t=(await db.from("technicians").select("*").eq("active",true)).data||[],j=(await db.from("repair_jobs").select("id,job_number,description")).data||[];P.innerHTML='<h2>Add Technician Hours</h2><form id=f><label>Technician<select id=t>'+t.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Job<select id=j>'+j.map(x=>'<option value="'+x.id+'">#'+x.job_number+' — '+esc(x.description)+'</option>').join("")+'</select></label><div class=formgrid><label>Hours<input id=h type=number step=.25 required></label><label>Date<input id=d type=date value="'+new Date().toISOString().slice(0,10)+'"></label></div><button>Save</button></form>';show();f.onsubmit=async e=>{e.preventDefault();let x=t.find(z=>z.id==t.value);await db.from("technician_hours").insert({technician_id:x.id,job_id:j.value,work_date:d.value,hours:+h.value,cost_rate:x.cost_per_hour,billed_rate:x.default_bill_rate});technicians()}}

async function bookkeeping(){P.innerHTML='<h2>📚 Bookkeeping</h2><p class=muted>Review revenue, costs, expenses and GST/PST for a date range.</p><div class=formgrid><label>From<input id=fr type=date value="'+new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10)+'"></label><label>To<input id=to type=date value="'+new Date().toISOString().slice(0,10)+'"></label></div><button onclick="report()">Generate Report</button><div id=r></div>';show()}
async function report(){let f=fr.value,t=to.value,[ii,h,e,x]=(await Promise.all([db.from("invoice_items").select("*,invoices!inner(invoice_date)").gte("invoices.invoice_date",f).lte("invoices.invoice_date",t),db.from("technician_hours").select("*").gte("work_date",f).lte("work_date",t),db.from("shop_expenses").select("*").gte("expense_date",f).lte("expense_date",t),db.from("fixed_expenses").select("*").eq("active",true)])).map(q=>q.data||[]);let rev=ii.reduce((s,a)=>s+a.unit_price*a.quantity,0),lab=h.reduce((s,a)=>s+a.hours*a.cost_rate,0),ex=e.reduce((s,a)=>s+ +a.amount,0)+x.reduce((s,a)=>s+ +a.amount,0),g=ii.reduce((s,a)=>s+ +a.gst_amount,0),p=ii.reduce((s,a)=>s+ +a.pst_amount,0);r.innerHTML='<div class=item><h3>Bookkeeping Report</h3><div>Revenue <b>'+money(rev)+'</b></div><div>Technician cost <b>'+money(lab)+'</b></div><div>Expenses <b>'+money(ex)+'</b></div><div class=grand>Operating result <b>'+money(rev-lab-ex)+'</b></div><hr><div>GST charged <b>'+money(g)+'</b></div><div>PST charged <b>'+money(p)+'</b></div></div>'}
async function scan(){P.innerHTML='<h2>📷 Supplier Invoice Scanner</h2><input id=file type=file accept="image/*"><div id=o></div>';show();file.onchange=e=>{o.innerHTML="<p>Image selected. OCR review can be added to the supplier workflow.</p>"}}

const map={customers,vehicles,estimates,invoices,jobs:()=>{P.innerHTML="<h2>Jobs</h2><p class=muted>Use the existing repair job workflow.</p>";show()},parts,supplies:()=>{P.innerHTML="<h2>Shop Supplies</h2><p class=muted>Supply tracking is stored in Supabase.</p>";show()},technicians,payments,fixed,expenses,bookkeeping,scan};
document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>map[b.dataset.s]());
(async()=>{let r=await db.auth.getSession();r.data.session?shell():out()})();
</script></body></html>
